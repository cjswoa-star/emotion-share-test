<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한줄 감정 공유 - 실시간 연결 실험</title>
<script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=3543"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f8;color:#202124;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:850px;margin:auto;padding:20px}
h1{font-size:26px;margin:0 0 8px}
p{color:#65656f;line-height:1.5}
.box{background:#fff;border:1px solid #e6e6eb;border-radius:22px;padding:20px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:15px;padding:13px 18px;font-weight:800}
.primary{background:#22242a;color:white}
.light{background:#ededf1;color:#222}
.big{font-size:20px;padding:18px 24px;flex:1}
input,textarea{width:100%;border:1px solid #dcdce3;border-radius:15px;padding:14px;background:#fff;font-size:17px}
textarea{min-height:100px;resize:vertical}
.code{font-size:32px;font-weight:900;letter-spacing:2px;background:#f1f1f5;border-radius:16px;padding:14px;text-align:center;word-break:break-all}
.status{padding:10px 12px;border-radius:12px;background:#f1f1f5;margin-top:12px;font-size:14px}
.status.ok{background:#e6f6ea}
.status.err{background:#fdeaea;color:#8c2525}
.hidden{display:none}
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{background:#fff7c7;border-radius:18px;padding:16px;font-size:18px;line-height:1.45;min-height:82px;display:flex;align-items:center}
.count{font-weight:900}
.small{font-size:13px;color:#777783}
@media(max-width:600px){.wrap{padding:13px}.wall{grid-template-columns:1fr}.big{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>한 줄 감정 공유 · 연결 실험</h1>
  <p>목표는 하나입니다. <b>학생 기기에서 보낸 문장이 교사 화면에 바로 뜨는지</b> 확인합니다.</p>

  <div id="chooser" class="box">
    <div class="row">
      <button class="primary big" id="teacherStart">교사 화면 열기</button>
      <button class="light big" id="studentStart">학생 화면 열기</button>
    </div>
  </div>

  <section id="teacher" class="box hidden">
    <h2>교사 화면</h2>
    <div class="small">학생에게 아래 방 번호를 알려주세요.</div>
    <div id="roomCode" class="code">연결 준비 중…</div>
    <div id="teacherStatus" class="status">PeerJS Cloud 연결 중…</div>
    <p>질문: <b>방금 경험에서 어떤 감정이 들었나요?</b></p>
    <div><span class="count" id="count">0</span>개의 의견</div>
    <div id="wall" class="wall"></div>
  </section>

  <section id="student" class="box hidden">
    <h2>학생 화면</h2>
    <label class="small">1. 선생님 화면의 방 번호</label>
    <input id="joinCode" autocomplete="off" placeholder="예: emotion-ab12cd34">
    <button class="primary" id="connectBtn" style="width:100%;margin-top:10px">방에 들어가기</button>
    <div id="studentStatus" class="status">아직 연결하지 않았어요.</div>

    <div id="sendArea" class="hidden">
      <p><b>방금 경험에서 어떤 감정이 들었나요?</b></p>
      <textarea id="message" maxlength="100" placeholder="예: 답답했어요. 친구의 선택이 예상과 달랐어요."></textarea>
      <button class="primary" id="sendBtn" style="width:100%;margin-top:10px">보내기</button>
    </div>
  </section>
</div>

<script>
let teacherPeer=null, studentPeer=null, studentConn=null;
let received=[];
const $=id=>document.getElementById(id);
const setStatus=(id,msg,type="")=>{
  const el=$(id); el.textContent=msg; el.className="status "+type;
};
const makeRoom=()=> "emotion-"+Math.random().toString(36).slice(2,10);

function showOnly(id){
  $("chooser").classList.add("hidden");
  $("teacher").classList.add("hidden");
  $("student").classList.add("hidden");
  $(id).classList.remove("hidden");
}

$("teacherStart").onclick=()=>{
  showOnly("teacher");
  if(typeof Peer==="undefined"){
    setStatus("teacherStatus","PeerJS를 불러오지 못했습니다. 인터넷 연결을 확인하세요.","err"); return;
  }
  const room=makeRoom();
  $("roomCode").textContent=room;

  teacherPeer=new Peer(room);

  teacherPeer.on("open", id=>{
    $("roomCode").textContent=id;
    setStatus("teacherStatus","교사 방이 열렸습니다. 학생 연결을 기다리는 중입니다.","ok");
  });

  teacherPeer.on("connection", conn=>{
    setStatus("teacherStatus","학생이 연결되었습니다. 의견을 받을 수 있습니다.","ok");
    conn.on("data", data=>{
      if(!data || data.type!=="emotion" || !data.text) return;
      received.push(String(data.text).slice(0,100));
      renderWall();
      try { conn.send({type:"ack"}); } catch(e){}
    });
  });

  teacherPeer.on("error", err=>{
    setStatus("teacherStatus","연결 오류: "+(err.type||err.message||"알 수 없는 오류"),"err");
  });
};

$("studentStart").onclick=()=>{
  showOnly("student");
};

$("connectBtn").onclick=()=>{
  const code=$("joinCode").value.trim();
  if(!code){ setStatus("studentStatus","방 번호를 입력하세요.","err"); return; }
  if(typeof Peer==="undefined"){
    setStatus("studentStatus","PeerJS를 불러오지 못했습니다. 인터넷 연결을 확인하세요.","err"); return;
  }

  if(studentPeer){ try{studentPeer.destroy()}catch(e){} }
  studentPeer=new Peer();

  studentPeer.on("open", ()=>{
    setStatus("studentStatus","선생님 방에 연결하는 중…");
    studentConn=studentPeer.connect(code,{reliable:true});

    studentConn.on("open", ()=>{
      setStatus("studentStatus","연결되었습니다! 이제 한 줄을 보내보세요.","ok");
      $("sendArea").classList.remove("hidden");
    });

    studentConn.on("data", data=>{
      if(data && data.type==="ack"){
        setStatus("studentStatus","전송 성공! 선생님 화면을 확인하세요.","ok");
      }
    });

    studentConn.on("close", ()=>{
      setStatus("studentStatus","연결이 끊어졌습니다.","err");
      $("sendArea").classList.add("hidden");
    });

    studentConn.on("error", err=>{
      setStatus("studentStatus","데이터 연결 오류: "+(err.message||"오류"),"err");
    });
  });

  studentPeer.on("error", err=>{
    setStatus("studentStatus","연결 오류: "+(err.type||err.message||"알 수 없는 오류"),"err");
  });
};

$("sendBtn").onclick=()=>{
  const text=$("message").value.trim();
  if(!text){ setStatus("studentStatus","한 줄을 입력하세요.","err"); return; }
  if(!studentConn || !studentConn.open){
    setStatus("studentStatus","아직 교사 화면과 연결되지 않았습니다.","err"); return;
  }
  studentConn.send({type:"emotion",text});
  $("message").value="";
  setStatus("studentStatus","보냈습니다. 교사 화면의 반영을 확인하세요.","ok");
};

function renderWall(){
  $("count").textContent=received.length;
  $("wall").innerHTML=received.map(x=>`<div class="card">${escapeHtml(x)}</div>`).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
</script>
</body>
</html>
