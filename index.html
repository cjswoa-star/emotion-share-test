<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 줄 감정 공유 - Firebase 실시간 실험</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f8;color:#202124;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:850px;margin:auto;padding:20px}
h1{font-size:26px;margin:0 0 8px}
p{color:#65656f;line-height:1.5}
.box{background:#fff;border:1px solid #e6e6eb;border-radius:22px;padding:20px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:15px;padding:13px 18px;font-weight:800}
.primary{background:#22242a;color:white}
.light{background:#ededf1;color:#222}
.danger{background:#fff0f0;color:#9a2d2d}
.big{font-size:20px;padding:18px 24px;flex:1}
textarea{width:100%;border:1px solid #dcdce3;border-radius:15px;padding:14px;background:#fff;font-size:17px;min-height:110px;resize:vertical}
.status{padding:10px 12px;border-radius:12px;background:#f1f1f5;margin-top:12px;font-size:14px}
.status.ok{background:#e6f6ea;color:#176b34}
.status.err{background:#fdeaea;color:#8c2525}
.hidden{display:none}
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{background:#fff7c7;border-radius:18px;padding:16px;font-size:18px;line-height:1.45;min-height:82px;display:flex;align-items:center;word-break:break-word}
.count{font-weight:900}
.small{font-size:13px;color:#777783}
.teacher-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:600px){.wrap{padding:13px}.wall{grid-template-columns:1fr}.big{width:100%}}
</style>
<script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=5662"></script>
</head>
<body>
<div class="wrap">
  <h1>한 줄 감정 공유 · 실시간 실험</h1>
  <p>학생이 보낸 문장이 <b>교사 화면에 바로 뜨는지</b> 확인하는 최소 테스트입니다.</p>

  <div id="chooser" class="box">
    <div class="row">
      <button class="primary big" id="teacherStart">교사 화면</button>
      <button class="light big" id="studentStart">학생 화면</button>
    </div>
    <div id="appStatus" class="status">Firebase 연결 준비 중…</div>
  </div>

  <section id="teacher" class="box hidden">
    <h2>교사 화면</h2>
    <div id="teacherStatus" class="status">실시간 데이터 연결 중…</div>
    <p>질문: <b>방금 경험에서 어떤 감정이 들었나요?</b></p>
    <div><span class="count" id="count">0</span>개의 의견</div>
    <div class="teacher-actions">
      <button class="light" id="backTeacher">처음으로</button>
      <button class="danger" id="clearBtn">의견 모두 지우기</button>
    </div>
    <div id="wall" class="wall"></div>
  </section>

  <section id="student" class="box hidden">
    <h2>학생 화면</h2>
    <p><b>방금 경험에서 어떤 감정이 들었나요?</b></p>
    <textarea id="message" maxlength="100" placeholder="예: 답답했어요. 친구의 선택이 예상과 달랐어요."></textarea>
    <button class="primary" id="sendBtn" style="width:100%;margin-top:10px">보내기</button>
    <button class="light" id="backStudent" style="width:100%;margin-top:8px">처음으로</button>
    <div id="studentStatus" class="status">한 줄을 적고 보내보세요.</div>
    <div class="small" style="margin-top:10px">이 테스트에서는 이름이나 개인정보를 적지 마세요.</div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6mWBT6IYc9BkGBPvPhIb0HBDA0Vj3Bxo",
  authDomain: "emotion-share-test.firebaseapp.com",
  databaseURL: "https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "emotion-share-test",
  storageBucket: "emotion-share-test.firebasestorage.app",
  messagingSenderId: "9314731156",
  appId: "1:9314731156:web:528c2ff5274f3c4cbee081"
};

const $ = id => document.getElementById(id);
const setStatus = (id,msg,type="") => {
  const el=$(id);
  el.textContent=msg;
  el.className="status "+type;
};

let db;
let messagesRef;
let unsubscribe = null;

function show(id){
  $("chooser").classList.add("hidden");
  $("teacher").classList.add("hidden");
  $("student").classList.add("hidden");
  $(id).classList.remove("hidden");
}

function showHome(){
  if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  $("teacher").classList.add("hidden");
  $("student").classList.add("hidden");
  $("chooser").classList.remove("hidden");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function renderWall(items){
  $("count").textContent=items.length;
  $("wall").innerHTML=items.length
    ? items.map(item=>`<div class="card">${escapeHtml(item.text)}</div>`).join("")
    : `<div class="small">아직 의견이 없습니다.</div>`;
}

try{
  const app=initializeApp(firebaseConfig);
  db=getDatabase(app);
  messagesRef=ref(db,"emotion-share-test/messages");
  setStatus("appStatus","Firebase 연결 준비 완료. 교사 또는 학생 화면을 선택하세요.","ok");
}catch(err){
  console.error(err);
  setStatus("appStatus","Firebase 초기화 오류: "+(err.message||err),"err");
}

$("teacherStart").onclick=()=>{
  if(!messagesRef){ setStatus("appStatus","Firebase 연결이 아직 준비되지 않았습니다.","err"); return; }
  show("teacher");
  setStatus("teacherStatus","실시간으로 의견을 기다리고 있습니다.","ok");
  unsubscribe=onValue(messagesRef,(snapshot)=>{
    const raw=snapshot.val()||{};
    const items=Object.values(raw).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderWall(items);
  },(err)=>{
    console.error(err);
    setStatus("teacherStatus","데이터 읽기 오류: "+(err.message||err),"err");
  });
};

$("studentStart").onclick=()=>{
  if(!messagesRef){ setStatus("appStatus","Firebase 연결이 아직 준비되지 않았습니다.","err"); return; }
  show("student");
};

$("sendBtn").onclick=async()=>{
  const text=$("message").value.trim();
  if(!text){ setStatus("studentStatus","한 줄을 입력하세요.","err"); return; }
  try{
    await push(messagesRef,{text:text.slice(0,100),createdAt:serverTimestamp()});
    $("message").value="";
    setStatus("studentStatus","전송 성공! 교사 화면을 확인하세요.","ok");
  }catch(err){
    console.error(err);
    setStatus("studentStatus","전송 오류: "+(err.message||err),"err");
  }
};

$("clearBtn").onclick=async()=>{
  if(!confirm("현재 의견을 모두 지울까요?")) return;
  try{
    await remove(messagesRef);
    setStatus("teacherStatus","의견을 모두 지웠습니다. 새 의견을 기다리는 중입니다.","ok");
  }catch(err){
    console.error(err);
    setStatus("teacherStatus","삭제 오류: "+(err.message||err),"err");
  }
};

$("backTeacher").onclick=showHome;
$("backStudent").onclick=showHome;
</script>
</body>
</html>
