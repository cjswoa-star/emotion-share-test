<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FAMOUS PEOPLE SEL · 참가자 V2</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f2}#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="host" title="FAMOUS PEOPLE SEL 참가자 V2"></iframe>
<script>
const host=document.getElementById('host');
const target=new URL('demo/index.html',location.href);target.search=location.search;host.src=target.href;
let timer=null;
function ensureScript(d,id,src){
  return new Promise((resolve,reject)=>{
    let s=d.getElementById(id);
    if(s){if(s.dataset.ready==='1')return resolve();s.addEventListener('load',()=>resolve(),{once:true});s.addEventListener('error',reject,{once:true});return}
    s=d.createElement('script');s.id=id;s.src=src;
    s.onload=()=>{s.dataset.ready='1';resolve()};s.onerror=reject;d.head.appendChild(s);
  });
}
async function wire(){
  try{
    const outerDoc=host.contentDocument;if(!outerDoc)return;
    const appFrame=outerDoc.getElementById('frame');if(!appFrame)return;
    const inject=async()=>{
      try{
        const d=appFrame.contentDocument;if(!d||!d.head||d.__FP_V2_WIRING)return;
        d.__FP_V2_WIRING=true;
        const start=d.getElementById('start');
        if(start){start.disabled=true;start.dataset.oldText=start.textContent;start.textContent='화면 준비 중...'}
        await ensureScript(d,'fpFeedbackParticipantPatch',new URL('demo/feedback-participant-patch.js?v=feedback7',location.href).href);
        await ensureScript(d,'fpParticipantStage3',new URL('demo/feedback-participant-stage3.js?v=feedback7',location.href).href);
        await Promise.all([
          ensureScript(d,'fpMobileHardeningPatch',new URL('demo/feedback-mobile-patch.js?v=feedback7',location.href).href),
          ensureScript(d,'fpChoiceClarityPatch',new URL('demo/feedback-visual-patch.js?v=feedback7',location.href).href)
        ]);
        const b=d.getElementById('start');
        if(b&&typeof appFrame.contentWindow.renderEntry==='function'){
          b.disabled=false;b.textContent=b.dataset.oldText||'시작하기';b.onclick=appFrame.contentWindow.renderEntry;
        }
        d.__FP_V2_READY=true;
      }catch(e){console.warn('participant patch inject',e)}finally{try{const d=appFrame.contentDocument;if(d)d.__FP_V2_WIRING=false}catch{}}
    };
    appFrame.addEventListener('load',inject);inject();
  }catch(e){console.warn('participant wrapper wire',e)}
}
host.addEventListener('load',()=>{wire();clearInterval(timer);timer=setInterval(wire,700)});
</script>
</body>
</html>
