<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef0ed">
<title>FAMOUS PEOPLE SEL · 진행자</title>
<link rel="stylesheet" href="demo/admin.css?v=event-public2">
<style>.boot-fallback{max-width:720px;margin:8vh auto;padding:28px;border:3px solid #35556a;border-radius:24px;background:#fff;color:#35556a;font-family:system-ui,'Noto Sans KR',sans-serif}.boot-fallback h1{margin:0 0 10px}.boot-fallback p{line-height:1.6;color:#627781}</style>
</head>
<body>
<div id="app"><div class="boot-fallback"><h1>FAMOUS PEOPLE SEL · 진행자</h1><p id="bootMsg">진행자 화면을 불러오는 중입니다.</p></div></div>
<div id="toast" class="toast">복사되었습니다.</div>
<script>window.addEventListener('error',function(e){var m=document.getElementById('bootMsg');if(m)m.textContent='진행자 프로그램 파일을 불러오지 못했습니다: '+(e.message||'알 수 없는 오류');});</script>
<script src="demo/admin-core.js?v=event-public2"></script>
<script src="demo/admin-ui.js?v=event-public2"></script>
<script>qr=function(el,url,size){if(!el)return;const src=new URL('demo/participant-qr.svg',document.baseURI);src.searchParams.set('v','event-public2');el.innerHTML=`<img src="${src.href}" alt="참가자 접속 QR" width="${size}" height="${size}">`};</script>
</body>
</html>
