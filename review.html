function sizes(n){if(n<=0)return[];if(n<=5)return[n];const o=[];while(n>8){o.push(4);n-=4}if(n===6)return o.concat([3,3]);if(n===7)return o.concat([3,4]);if(n===8)return o.concat([4,4]);return o.concat([n])}function groups(rs){const a=[...rs].sort((x,y)=>x.id.localeCompare(y.id)),o=[];let k=0;sizes(a.length).forEach(z=>{o.push(a.slice(k,k+z));k+=z});return o}
function normalizeGroupMap(raw){return Object.entries(raw||{}).map(([id,g])=>({id,...g}))}
function memberRows(data,g){const m=new Set(g?.members||[]);return rows(data).filter(r=>m.has(r.id))}
function myStoredGroup(data,key){return normalizeGroupMap(data?.groups?.[key]).find(g=>(g.members||[]).includes(state.participantId))||null}
function buildDialogue1Groups(data){const rr=rows(data),out={};let gi=1;SCENES.forEach(s=>{const people=rr.filter(r=>r.focusScene===s.id);groups(people).forEach(g=>{const id='g'+String(gi++).padStart(2,'0');out[id]={sceneId:s.id,members:g.map(r=>r.id),createdAt:Date.now()}})});return out}
function groupsInOrder(rs){const o=[];let k=0;sizes(rs.length).forEach(z=>{o.push(rs.slice(k,k+z));k+=z});return o}
function interleaveReasonRows(people){const b={};people.forEach(r=>(b[r.deepDive.reason]||(b[r.deepDive.reason]=[])).push(r));Object.values(b).forEach(a=>a.sort((x,y)=>x.id.localeCompare(y.id)));const ks=Object.keys(b).sort((a,z)=>a.localeCompare(z,'ko')),flat=[];let more=true;while(more){more=false;for(const k of ks){if(b[k].length){flat.push(b[k].shift());more=true}}}return flat}
function buildDialogue2Groups(data){const rr=rows(data).filter(r=>r.focusScene&&r.deepDive?.reason);const caps=sizes(rr.length),buckets={};SCENES.forEach(s=>buckets[s.id]=rr.filter(r=>r.focusScene===s.id).sort((a,b)=>a.id.localeCompare(b.id)));const ordered=[];let more=true;while(more){more=false;const active=SCENES.map(s=>buckets[s.id]).filter(a=>a.length).sort((a,b)=>b.length-a.length);for(const a of active){if(a.length){ordered.push(a.shift());more=true}}}const gs=caps.map((cap,i)=>({id:'g'+String(i+1).padStart(2,'0'),cap,members:[],sceneIds:new Set()}));for(const p of ordered){let candidates=gs.filter(g=>g.members.length<g.cap);let target=candidates.filter(g=>!g.sceneIds.has(p.focusScene)).sort((a,b)=>a.members.length-b.members.length||a.sceneIds.size-b.sceneIds.size)[0];if(!target)target=candidates.sort((a,b)=>a.members.length-b.members.length)[0];if(!target)continue;target.members.push(p.id);target.sceneIds.add(p.focusScene)}const out={};gs.forEach(g=>out[g.id]={mode:'mixedScenes',members:g.members,sceneIds:[...g.sceneIds],createdAt:Date.now()});return out}

function renderEntry(){app.innerHTML=shell(`<div class="entry"><div class="kicker">FAMOUS PEOPLE SEL</div><h1>오늘 사용할 이름을 정해볼까요?</h1><p class="subtitle">실명 대신 서로 알아볼 수 있는 짧은 닉네임이면 충분해요.</p><label for="nick">닉네임</label><input id="nick" class="nickname" maxlength="10" value="${esc(state.nickname)}" placeholder="예: 민들레" autocomplete="off"><p class="small" style="margin-top:9px">이 닉네임은 잠시 뒤 같은 장면이나 이유를 고른 사람과 만날 때 사용됩니다.</p><button class="btn orange" id="next" style="width:100%;margin-top:16px" disabled>마음의 이동 시작하기</button></div>`);const i=document.getElementById('nick'),b=document.getElementById('next');const v=()=>b.disabled=!i.value.trim();i.oninput=v;v();b.onclick=async()=>{await saveNick(i.value);state.sceneIndex=0;renderScene(0)};qa()}
function renderScene(i){state.sceneIndex=i;const s=SCENES[i],p=state.checkpoints[s.id];app.innerHTML=shell(`${topbar('마음 훑어보기')}<div class="scene-head"><div class="scene-counter">${s.n} / ${String(SCENES.length).padStart(2,"0")}</div><h1>${s.title}</h1><p>${s.desc}</p></div><div class="question">그 순간, 역할 속 나는 어떤 마음이었나요?</div>${moodStage(mapHTML('mood',p))}<div class="map-hint" id="hint">${p?.status==='experienced'?`이 근처의 마음 · <b>${hintWords(p).join(' · ')}</b>`:'먼저 마음지도에서 내 위치를 가볍게 눌러보세요.'}</div><div class="scene-actions"><button class="skip" id="skip">이 장면은 직접 경험하지 않았어요</button><button class="btn primary next-scene" id="next" ${p?'':'disabled'}>${i===SCENES.length-1?'내 마음의 이동 보기':'다음 장면'}</button></div>`);document.querySelector('[data-back]').onclick=()=>i?renderScene(i-1):renderScene(0);const map=document.getElementById('mood'),nb=document.getElementById('next');map.onclick=async e=>{const r=map.getBoundingClientRect(),x=Math.max(.02,Math.min(.98,(e.clientX-r.left)/r.width)),y=Math.max(.02,Math.min(.98,(e.clientY-r.top)/r.height)),v={status:'experienced',x:+x.toFixed(4),y:+y.toFixed(4)};await saveCheck(s.id,v);let d=map.querySelector('.dot');if(!d){d=document.createElement('i');d.className='dot';map.appendChild(d)}d.style.left=x*100+'%';d.style.top=y*100+'%';document.getElementById('hint').innerHTML=`이 근처의 마음 · <b>${hintWords(v).join(' · ')}</b><br><span class="small">지금은 감정을 고르는 단계가 아니라 위치를 확인하는 단계예요.</span>`;nb.disabled=false};document.getElementById('skip').onclick=async()=>{await saveCheck(s.id,{status:'skipped'});i===SCENES.length-1?renderJourney():renderScene(i+1)};nb.onclick=()=>i===SCENES.length-1?renderJourney():renderScene(i+1);qa()}
function renderJourney(active=0){const s=SCENES[active],p=state.checkpoints[s.id];app.innerHTML=shell(`${topbar('내 마음의 이동')}<div class="journey-head"><h1>일곱 순간의 내 마음</h1><p>점들의 위치가 어떻게 달라졌는지 훑어보세요. 경험하지 않은 장면은 선으로 연결하지 않았어요.</p></div><div class="journey-focus">${s.n} ${s.title}${p?.status==='skipped'?' · 경험하지 않음':''}</div>${moodStage(`<div class="mood-map journey-map">${journeySvg(active)}</div>`)}<div class="legend">${SCENES.map((x,i)=>`<button data-i="${i}" class="${state.checkpoints[x.id]?.status==='skipped'?'skipped':''}">${x.n} ${x.title.replace(' 순간','').slice(0,13)}</button>`).join('')}</div><button class="btn orange bottom-one" id="choose">조금 더 들여다볼 순간 고르기</button>`);document.querySelector('[data-back]').onclick=()=>renderScene(SCENES.length-1);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>renderJourney(+b.dataset.i));document.getElementById('choose').onclick=renderSelect;qa()}
function renderSelect(){app.innerHTML=shell(`${topbar('한 장면 고르기')}<div class="select-head"><h1>지금 조금 더 들여다보고 싶은 순간은 어디인가요?</h1><p>마음이 크게 움직였거나, 왜 그런 마음이 들었는지 궁금한 순간 하나를 골라주세요.</p></div><div class="scene-grid">${SCENES.map(s=>{const sk=state.checkpoints[s.id]?.status==='skipped';return `<button class="scene-card ${sk?'skipped':''}" data-s="${s.id}" ${sk?'disabled':''}><span class="num">${s.n}</span><span class="title">${s.title}</span></button>`}).join('')}</div><div class="selection-note">직접 경험하지 않은 장면은 선택에서 제외됩니다.</div>`);document.querySelector('[data-back]').onclick=renderJourney;document.querySelectorAll('[data-s]:not([disabled])').forEach(b=>b.onclick=async()=>{await saveFocus(b.dataset.s);renderMeeting1()});qa()}
function renderMeeting1(){state.unsub?.();const s=SCENES.find(x=>x.id===state.focusScene);app.innerHTML=shell(`${topbar('첫 번째 만남')}<div class="meeting-head"><div class="kicker">같은 장면에서 먼저 이야기하기</div><h1>같은 장면을 고른 사람을 만나봅니다.</h1><p>${s.n} ${s.title}</p></div><div class="meeting-card"><div class="meeting-scene" id="status">${reviewMode?'내가 이야기할 모둠':'진행자가 모둠을 준비하고 있어요.'}</div><div class="names" id="names">${reviewMode?`<span class="name-chip self">${esc(state.nickname||'나')}</span><span class="name-chip">별빛</span><span class="name-chip">구름</span><span class="name-chip">고래</span>`:`<span class="name-chip self">${esc(state.nickname||'나')}</span>`}</div><div class="dialogue-guide"><div class="dialogue-step"><b>1</b><div><strong>왜 이 장면을 더 들여다보고 싶었나요?</strong>장면을 고른 첫 이유를 편하게 말해보세요.</div></div><div class="dialogue-step"><b>2</b><div><strong>그 장면에서 어떤 느낌이 남아 있나요?</strong>아직 정확한 감정 이름을 붙이지 않아도 괜찮습니다.</div></div></div><div class="waiting-note" id="note">${reviewMode?'서로의 이야기를 들어보세요.':'모둠이 열리면 함께 이야기할 닉네임이 나타납니다.'}</div>${reviewMode?'<button class="btn orange" id="reviewDeep" style="margin-top:8px;width:100%">내 마음 깊이 들여다보기</button>':'<div class="waiting-lock">진행자가 다음 단계를 열면 자동으로 이동합니다.</div>'}</div><div class="small" style="text-align:center">대화가 끝나면 다시 휴대폰을 봅니다.</div>`);document.querySelector('[data-back]').onclick=renderSelect;if(reviewMode){document.getElementById('reviewDeep').onclick=renderEmotion;qa();return}state.unsub=listen(`sessions/${state.sessionId}`,data=>{if(data?.meta?.phase==='deep'){state.unsub?.();state.unsub=null;renderEmotion();return}const open=!!data?.meta?.dialogue1Open,g=myStoredGroup(data,'dialogue1'),mine=g?memberRows(data,g):[];document.getElementById('status').textContent=open?'내가 이야기할 모둠':'진행자가 모둠을 준비하고 있어요.';document.getElementById('names').innerHTML=open&&mine.length?mine.map(r=>`<span class="name-chip ${r.id===state.participantId?'self':''}">${esc(r.nickname)}</span>`).join(''):`<span class="name-chip self">${esc(state.nickname)}</span>`;document.getElementById('note').textContent=open?(mine.length<=1?'이 장면을 고른 사람이 지금은 나뿐이에요. 잠시 혼자 돌아봐도 괜찮아요.':`${mine.length}명이 한 모둠이에요. 지금은 사람을 보고 이야기해 주세요.`):'모둠이 열리면 함께 이야기할 닉네임이 나타납니다.'});qa()}
function deep(){if(!state.deepDive||state.deepDive.sceneId!==state.focusScene){state.deepDive={sceneId:state.focusScene,emotionWords:[],intensity:'',bodySignals:[],bodySignalText:'',urge:'',urgeText:'',reason:'',reasonText:'',lifeLink:'',nextAction:'',nextActionText:''}}return state.deepDive}

function roleFrame(){return `<div class="role-frame">지금부터는 <b>그 장면에서 역할로 참여했던 나</b>를 떠올려봅니다.</div>`}
function directInput(id,value,placeholder,button='확인'){return `<div class="custom-entry"><input id="${id}" maxlength="300" value="${esc(value||'')}" placeholder="${esc(placeholder)}"><button type="button" id="${id}Done">${button}</button></div>`}
function shownBodySignals(d){return (d.bodySignals||[]).map(x=>x===CUSTOM_LABEL?(d.bodySignalText||x):x)}
function shownUrge(d){return d.urge===CUSTOM_LABEL?(d.urgeText||d.urge):d.urge}
function shownReason(d){return d.reason===CUSTOM_LABEL?(d.reasonText||d.reason):d.reason}
function contextHTML(){const s=SCENES.find(x=>x.id===state.focusScene),p=state.checkpoints[state.focusScene];return `<div class="deep-context"><div class="mini-map">${p?.status==='experienced'?`<i class="dot" style="left:${p.x*100}%;top:${p.y*100}%"></i>`:''}</div><div><h2>${s?`${s.n} ${esc(s.title)}`:'내가 고른 장면'}</h2><p>내가 표시한 위치 · ${esc(positionLabel(p))}</p><p class="small" style="margin-top:5px">이 위치와 가까운 감정 이름부터 살펴봅니다.</p></div></div>`}
function renderEmotion(){const d=deep(),p=state.checkpoints[state.focusScene],cands=nearestWords(p,8),selected=new Set(d.emotionWords||[]);app.innerHTML=shell(`${topbar('내 마음 깊이 들여다보기')}${roleFrame()}${contextHTML()}<div class="emotion-question">그 순간의 마음을 어떤 말로 표현할 수 있을까요?</div><div class="word-grid">${cands.map(w=>`<button class="word ${selected.has(w.word)?'selected':''}" data-word="${w.word}">${w.word}</button>`).join('')}</div><div class="deep-footer"><span class="deep-count"><b id="wc">${selected.size}</b> / 2 선택</span><button class="btn primary" id="wordNext" ${selected.size?'':'disabled'}>이 마음으로 볼게요</button></div>`);document.querySelector('[data-back]').onclick=renderMeeting1;document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const w=b.dataset.word;if(selected.has(w))selected.delete(w);else{if(selected.size>=2)return;selected.add(w)}d.emotionWords=[...selected];document.querySelectorAll('[data-word]').forEach(x=>x.classList.toggle('selected',selected.has(x.dataset.word)));document.getElementById('wc').textContent=selected.size;document.getElementById('wordNext').disabled=!selected.size});document.getElementById('wordNext').onclick=renderIntensity;qa()}

function renderBody(){const d=deep(),chosen=new Set(d.bodySignals||[]),custom=chosen.has(CUSTOM_LABEL);app.innerHTML=shell(`${topbar('몸이 보낸 신호')}${roleFrame()}<div class="choice-head"><h1>그 장면에서 역할 속 나의 몸에는<br>어떤 반응이 있었나요?</h1><p>기억나는 것만 골라보세요. · 최대 2개</p></div><div class="body-grid" style="grid-template-rows:repeat(4,1fr)">${BODY_SIGNALS.map(x=>`<button class="body-btn ${chosen.has(x)?'selected':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="special-pair"><button class="${chosen.has('잘 모르겠어요')?'selected':''}" data-v="잘 모르겠어요">잘 모르겠어요</button><button class="${chosen.has(CUSTOM_LABEL)?'selected':''}" data-v="${CUSTOM_LABEL}">${CUSTOM_LABEL}</button></div><div id="bodyCustom">${custom?directInput('bodyOther',d.bodySignalText,'내 몸에서 느낀 반응을 적어보세요.'):''}</div><div class="deep-footer"><span class="deep-count"><b id="bc">${chosen.size}</b> / 2 선택</span><button class="btn primary" id="bodyNext" ${chosen.size?'':'disabled'}>다음</button></div>`);document.querySelector('[data-back]').onclick=renderIntensity;const sync=()=>{d.bodySignals=[...chosen];document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('selected',chosen.has(x.dataset.v)));document.getElementById('bc').textContent=chosen.size;document.getElementById('bodyNext').disabled=!chosen.size};const wireOther=()=>{const i=document.getElementById('bodyOther'),b=document.getElementById('bodyOtherDone');if(!i||!b)return;b.onclick=()=>{const v=i.value.trim().slice(0,36);if(!v)return;d.bodySignalText=v}};wireOther();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='잘 모르겠어요'){chosen.clear();chosen.add(v);d.bodySignalText='';document.getElementById('bodyCustom').innerHTML=''}else{chosen.delete('잘 모르겠어요');if(chosen.has(v)){chosen.delete(v);if(v===CUSTOM_LABEL){d.bodySignalText='';document.getElementById('bodyCustom').innerHTML=''}}else if(chosen.size<2){chosen.add(v);if(v===CUSTOM_LABEL){document.getElementById('bodyCustom').innerHTML=directInput('bodyOther',d.bodySignalText,'내 몸에서 느낀 반응을 적어보세요.');wireOther()}}}sync()});document.getElementById('bodyNext').onclick=()=>{const i=document.getElementById('bodyOther');if(i){const v=i.value.trim().slice(0,36);if(chosen.has(CUSTOM_LABEL)&&!v){i.focus();return}d.bodySignalText=v}renderUrge()};qa()}
function renderUrge(){const d=deep(),custom=d.urge===CUSTOM_LABEL;app.innerHTML=shell(`${topbar('마음과 행동')}${roleFrame()}<div class="choice-head"><h1>그 장면에서 역할 속 나는<br>무엇을 하고 싶어졌나요?</h1><p>실제로 한 행동이 아니라, 그 순간 올라온 행동의 방향을 떠올려보세요.</p></div><div class="choice-grid urge-grid" style="grid-template-rows:repeat(4,minmax(0,1fr))">${[...URGES,'잘 모르겠어요'].map(x=>`<button class="choice-btn ${d.urge===x?'selected':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="urge-custom-bottom"><button class="${custom?'selected':''}" data-v="${CUSTOM_LABEL}">${CUSTOM_LABEL}</button></div><div id="urgeCustom">${custom?directInput('urgeOther',d.urgeText,'그때 하고 싶었던 것을 적어보세요.'):''}</div>`);document.querySelector('[data-back]').onclick=renderBody;const wire=()=>{const i=document.getElementById('urgeOther'),b=document.getElementById('urgeOtherDone');if(!i||!b)return;b.onclick=()=>{const v=i.value.trim().slice(0,36);if(!v)return;d.urgeText=v;renderReason()}};wire();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{d.urge=b.dataset.v;if(d.urge===CUSTOM_LABEL){document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('selected',x.dataset.v===d.urge));document.getElementById('urgeCustom').innerHTML=directInput('urgeOther',d.urgeText,'그때 하고 싶었던 것을 적어보세요.');wire()}else{d.urgeText='';renderReason()}});qa()}
function renderReason(){const d=deep();app.innerHTML=shell(`${topbar('마음의 이유')}${roleFrame()}<div class="choice-head"><h1>그 장면에서 그런 마음이 든 이유는 무엇일까요?</h1><p>가장 가까운 이유를 고르거나, 내 말로 적어보세요.</p></div><div class="choice-grid reason-grid">${REASONS.map(x=>`<button class="choice-btn ${d.reason===x?'selected':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="special-pair"><button class="${d.reason==='잘 모르겠어요'?'selected':''}" data-v="잘 모르겠어요">잘 모르겠어요</button><button class="${d.reason===CUSTOM_LABEL?'selected':''}" id="reasonCustomBtn">${CUSTOM_LABEL}</button></div>`,'reason-screen');document.querySelector('[data-back]').onclick=renderUrge;document.querySelectorAll('.reason-grid [data-v],.reason-screen .special-pair [data-v]').forEach(b=>b.onclick=async()=>{d.reason=b.dataset.v;d.reasonText='';document.querySelectorAll('.reason-grid [data-v],.reason-screen .special-pair [data-v]').forEach(x=>x.classList.toggle('selected',x.dataset.v===d.reason));await saveDeep();setTimeout(renderMeeting2,150)});document.getElementById('reasonCustomBtn').onclick=()=>{d.reason=CUSTOM_LABEL;renderReasonCustom()};qa()}
function renderReasonCustom(){const d=deep();app.innerHTML=shell(`${topbar('내 말로 적어보기')}${roleFrame()}<div class="choice-head"><h1>그 장면에서 그런 마음이 든 이유는 무엇일까요?</h1><p>떠오르는 이유를 자유롭게 적어보세요.</p></div><div class="custom-reason-panel"><div class="custom-reason-title"><span class="pen">✎</span>내 말로 적어볼게요</div><textarea id="reasonOther" maxlength="600" placeholder="그렇게 느낀 이유를 적어보세요.">${esc(d.reasonText||'')}</textarea><div class="custom-reason-count"><span id="reasonCount">${(d.reasonText||'').length}</span> / 80</div><div class="custom-reason-actions"><button class="btn soft" id="reasonCancel">다시 고르기</button><button class="btn confirm" id="reasonDone">확인</button></div></div>`,'reason-custom-screen');document.querySelector('[data-back]').onclick=renderReason;const ta=document.getElementById('reasonOther'),cnt=document.getElementById('reasonCount');ta.addEventListener('input',()=>cnt.textContent=ta.value.length);document.getElementById('reasonCancel').onclick=()=>{d.reason=null;d.reasonText='';renderReason()};document.getElementById('reasonDone').onclick=async()=>{const v=ta.value.trim().slice(0,600);if(!v){ta.focus();return}d.reason=CUSTOM_LABEL;d.reasonText=v;await saveDeep();renderMeeting2()};qa()}
function renderMeeting2(){state.unsub?.();const d=deep(),s=SCENES.find(x=>x.id===state.focusScene);app.innerHTML=shell(`${topbar('두 번째 만남')}<div class="meeting-head"><div class="kicker">다른 장면의 사람들과 만나기</div><h1>이번에는 서로 다른 장면의 이야기를 들어봅니다.</h1><p>내가 고른 장면 · ${s.n} ${s.title}</p></div><div class="meeting-card"><div class="mode-badge" id="mode">${reviewMode?'테스트 · 서로 다른 장면을 섞은 모둠':'진행자가 모둠을 준비하고 있어요.'}</div><div class="names" id="names">${reviewMode?`<span class="name-chip self">${esc(state.nickname||'나')}<span class="group-scene-chip">${s.n}</span></span><span class="name-chip">단풍<span class="group-scene-chip">02</span></span><span class="name-chip">바다<span class="group-scene-chip">04</span></span><span class="name-chip">하늘<span class="group-scene-chip">06</span></span>`:`<span class="name-chip self">${esc(state.nickname)}</span>`}</div><div class="dialogue-guide"><div class="dialogue-step"><b>1</b><div><strong>내가 고른 장면을 짧게 소개해 주세요.</strong>그 장면에서 어떤 마음·몸의 반응이 있었는지 한 가지를 덧붙여보세요.</div></div><div class="dialogue-step"><b>2</b><div><strong>왜 그런 반응이 나타났다고 생각했나요?</strong>내가 찾은 이유를 내 말로 설명해보세요.</div></div></div><div class="waiting-note" id="note">${reviewMode?'전체 흐름을 확인하기 위한 예시 모둠입니다.':'진행자가 두 번째 만남을 열면 모둠이 나타납니다.'}</div>${reviewMode?'<button class="btn orange" id="reviewLife" style="margin-top:8px;width:100%">테스트 계속 · 역할 밖의 나로</button>':'<div class="waiting-lock">진행자가 다음 단계를 열면 자동으로 이동합니다.</div>'}</div>`);document.querySelector('[data-back]').onclick=renderReason;if(reviewMode){document.getElementById('reviewLife').onclick=renderRoleTransition;qa();return}state.unsub=listen(`sessions/${state.sessionId}`,data=>{if(data?.meta?.phase==='life'){state.unsub?.();state.unsub=null;renderRoleTransition();return}const open=!!data?.meta?.dialogue2Open,g=myStoredGroup(data,'dialogue2'),mine=g?memberRows(data,g):[];if(!open)return;document.getElementById('mode').textContent='서로 다른 장면을 섞은 모둠';document.getElementById('names').innerHTML=mine.length?mine.map(r=>{const sc=SCENES.find(s=>s.id===r.focusScene);return `<span class="name-chip ${r.id===state.participantId?'self':''}">${esc(r.nickname)}<span class="group-scene-chip">${sc?.n||''}</span></span>`}).join(''):`<span class="name-chip self">${esc(state.nickname)}</span>`;document.getElementById('note').textContent=mine.length>1?`${mine.length}명이 한 모둠이에요. 서로 다른 장면의 경험을 들어보세요.`:'지금은 함께 매칭할 사람이 없어요. 잠시 혼자 정리하며 기다려도 괜찮아요.'});qa()}
function renderRoleTransition(){app.innerHTML=shell(`${topbar('역할에서 실제 나로')}<div class="transition-card"><div class="kicker">전환</div><p class="transition-context">역할 속에서 경험한 마음을 돌아봤습니다.</p><div class="arrow">↓</div><h1>이제 실제 나의 마음을<br>돌아봅니다.</h1><p>내 경험과 선택을 생각해 볼 시간입니다.</p><button class="btn orange" id="toLife" style="width:100%">실제 나로 돌아보기</button></div>`);document.querySelector('[data-back]').onclick=renderMeeting2;document.getElementById('toLife').onclick=renderLife;qa()}
function renderLife(){const d=deep();app.innerHTML=shell(`${topbar('실제 나에게 연결하기')}<div class="choice-head"><h1>실제 나에게도<br>비슷한 마음이나 상황이 있었나요?</h1><p>과정드라마에서 처음 경험해본 마음이라면 ‘잘 떠오르지 않아요’를 골라도 괜찮습니다. 구체적인 일을 말하거나 쓰지 않아도 됩니다.</p></div><div class="choice-grid" style="grid-template-rows:repeat(2,minmax(0,1fr))">${LIFE_LINKS.map(x=>`<button class="choice-btn ${d.lifeLink===x?'selected':''}" data-v="${x}">${x}</button>`).join('')}</div>`);document.querySelector('[data-back]').onclick=renderRoleTransition;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{d.lifeLink=b.dataset.v;await saveDeep();renderNextAction()});qa()}
function customHTML(v=''){return `<div class="custom-wrap"><input id="customInput" class="custom-input" maxlength="300" value="${esc(v)}" placeholder="짧게 적어주세요"><button class="btn primary" id="customDone">완료</button></div>`}
function renderNextAction(){const d=deep(),custom=d.nextAction==='내가 직접 적어보기';app.innerHTML=shell(`${topbar('다음의 나')}<div class="choice-head"><h1>실제 나에게 비슷한 상황이 생긴다면,<br>나는 어떻게 행동해보고 싶나요?</h1><p>감정을 없애는 방법이 아니라, 그 상황에서 내가 선택하고 싶은 행동을 생각해봅니다.</p></div><div class="next-grid">${NEXT_ACTIONS.map(x=>`<button class="next-btn ${d.nextAction===x?'selected':''}" data-v="${x}">${x}</button>`).join('')}</div><div id="custom">${custom?customHTML(d.nextActionText):''}</div>`);document.querySelector('[data-back]').onclick=renderLife;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{d.nextAction=b.dataset.v;if(d.nextAction==='내가 직접 적어보기'){document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('selected',x.dataset.v===d.nextAction));document.getElementById('custom').innerHTML=customHTML(d.nextActionText);wireCustom()}else{d.nextActionText='';await saveDeep();renderSummary()}});if(custom)wireCustom();qa()}
function wireCustom(){const i=document.getElementById('customInput'),b=document.getElementById('customDone');b.onclick=async()=>{const d=deep();if(!i.value.trim())return;d.nextActionText=i.value.trim().slice(0,300);await saveDeep();renderSummary()}}
function nextLabel(d){return d.nextAction==='내가 직접 적어보기'?(d.nextActionText||'직접 적은 행동'):d.nextAction}
function renderSummary(){const d=deep(),s=SCENES.find(x=>x.id===state.focusScene),p=state.checkpoints[state.focusScene];app.innerHTML=shell(`${topbar('내 마음 다시 보기')}<div class="summary-head"><h1>내가 선택한 것을 한눈에 보기</h1></div><div class="summary-paper"><div class="summary-scene">${s.n} ${s.title}</div><div class="summary-top"><div class="summary-map">${p?.status==='experienced'?`<i class="dot" style="left:${p.x*100}%;top:${p.y*100}%"></i>`:''}</div><div class="summary-main"><strong>${esc((d.emotionWords||[]).join(' · '))}</strong><br>${esc(d.intensity)} 느껴졌어요.<br><span class="small">역할 속 그 장면의 나 · ${esc(positionLabel(p))}</span></div></div><div class="summary-grid"><div class="summary-item"><span>역할 속 몸의 반응</span><strong>${esc(shownBodySignals(d).join(' · '))}</strong></div><div class="summary-item"><span>역할 속에서 하고 싶었던 것</span><strong>${esc(shownUrge(d))}</strong></div><div class="summary-item"><span>그 반응이 나타난 이유</span><strong>${esc(shownReason(d))}</strong></div><div class="summary-item"><span>실제 나에게 비슷한 상황이 온다면</span><strong>${esc(nextLabel(d))}</strong></div></div><div class="journey-mini-row"><div class="mini-journey-map">${journeySvg(null,true)}</div><div class="mini-journey-copy"><b>일곱 순간의 마음 이동</b><br>깊이 들여다본 장면은 ${s.n}번이에요. 경험하지 않은 장면은 연결선이 끊어져 있어요.</div></div></div><button class="btn orange" id="reflect" style="margin-top:7px">마지막으로 내 마음 정리하기</button>`);document.querySelector('[data-back]').onclick=renderNextAction;document.getElementById('reflect').onclick=renderReflection;qa()}
function renderReflection(){const f=state.finalReflection||{text:'',share:true};app.innerHTML=shell(`${topbar('마지막 한 문장')}<div class="reflection-head"><h1>오늘 활동을 마치며,<br>지금 떠오르는 생각이나 느낌은 무엇인가요?</h1><p class="reflection-helper">내 마음을 돌아본 경험과 다른 사람의 이야기를 떠올리며 자유롭게 적어보세요.</p></div><div class="reflection-card"><textarea id="reflection" maxlength="1000" placeholder="자유롭게 적어보세요.">${esc(f.text||'')}</textarea></div><button class="btn primary" id="done">작성한 문장 공유하기</button>`);document.querySelector('[data-back]').onclick=renderSummary;document.getElementById('done').onclick=async()=>{const value=document.getElementById('reflection').value.trim().slice(0,1000);if(!value){document.getElementById('reflection').focus();return}state.finalReflection={text:value,share:true,completedAt:Date.now()};await saveReflection();renderComplete()};qa()}
function renderReflectionWall(data=null){
 const d=data||debugData(),rr=rows(d),cards=rr.filter(r=>r.finalReflection?.text&&r.finalReflection?.share!==false);
 app.innerHTML=shell(`<div class="present-head"><div><div class="kicker">FAMOUS PEOPLE SEL · 마무리</div><h1>오늘 활동을 마치며</h1><div class="present-meta">공유된 성찰 ${cards.length}개 · 문장을 누르면 크게 볼 수 있습니다.</div><label class="quote-name-toggle"><input id="showQuoteNames" type="checkbox"> 팝업에 작성자 닉네임 표시</label></div></div><div class="reflection-wall">${cards.map((r,i)=>`<button type="button" class="reflection-note reflection-open" data-idx="${i}" aria-label="${i+1}번째 문장 크게 보기"><div class="who">문장 ${i+1}</div><div class="txt">${esc(r.finalReflection.text)}</div></button>`).join('')}${!cards.length?'<div class="reflection-note empty">아직 공유된 문장이 없습니다.</div>':''}</div><div id="reflectionOverlay" class="reflection-overlay" hidden role="dialog" aria-modal="true" aria-label="오늘 활동을 마치며"><div class="quote-frame"><button type="button" class="quote-close" aria-label="닫기">×</button><div class="quote-inner"><div class="quote-emblem" aria-hidden="true">❦</div><div class="quote-kicker">오늘 활동을 마치며</div><div class="quote-rule" aria-hidden="true"></div><div class="quote-text" id="quoteText"></div><div class="quote-rule quote-rule-bottom" aria-hidden="true"></div><div class="quote-signature" id="quoteSignature" hidden></div></div></div></div>`,'present-screen');
 const overlay=document.getElementById('reflectionOverlay'),quote=document.getElementById('quoteText'),signature=document.getElementById('quoteSignature'),nameToggle=document.getElementById('showQuoteNames');
 const close=()=>{overlay.hidden=true;document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};
 document.querySelectorAll('.reflection-open').forEach(btn=>btn.addEventListener('click',()=>{const selected=cards[Number(btn.dataset.idx)];quote.textContent=selected.finalReflection.text;signature.textContent=selected.nickname?'— '+selected.nickname:'';signature.hidden=!nameToggle.checked||!selected.nickname;overlay.hidden=false;document.addEventListener('keydown',onKey);overlay.querySelector('.quote-close').focus()}));

on></div>`,'present-screen');document.getElementById('different').onclick=openDialogue2;document.getElementById('life').onclick=startLife;qa()}

 showcaseIndex=0;renderShowcaseChrome();
 document.addEventListener('click',e=>{if(e.target.closest('[data-showcase-prev]')){e.preventDefault();showcaseGo(showcaseIndex-1)}else if(e.target.closest('[data-showcase-next]')){e.preventDefault();showcaseGo(showcaseIndex+1)}else{const j=e.target.closest('[data-review-jump]');if(j){showcaseIndex=showcaseStepIndex(j.dataset.reviewJump);setTimeout(updateShowcaseChrome,20)}}});
 document.addEventListener('keydown',e=>{const tag=(document.activeElement?.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();showcaseGo(showcaseIndex+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showcaseGo(showcaseIndex-1)}else if(e.key==='Home'){e.preventDefault();showcaseGo(0)}else if(e.key==='End'){e.preventDefault();showcaseGo(SHOWCASE_STEPS.length-1)}});
}

async function boot(){await initBackend();if(REVIEW_BUILD&&!debugMode){resetReviewState();state.participantId='review-self';renderIntro();return}if(debugMode){seedDebug();const f={entry:renderEntry,scene1:()=>renderScene(0),scene2:()=>renderScene(1),scene6:()=>renderScene(5),scene7:()=>renderScene(6),journey:renderJourney,select:renderSelect,meeting1:()=>{renderMeeting1();setTimeout(()=>{const d=debugData(),rr=rows(d).filter(r=>r.focusScene===state.focusScene),mine=groups(rr).find(g=>g.some(r=>r.id==='self'))||rr.slice(0,4);document.getElementById('status').textContent='내가 이야기할 모둠';document.getElementById('names').innerHTML=mine.map(r=>`<span class="name-chip ${r.id==='self'?'self':''}">${esc(r.nickname)}</span>`).join('');document.getElementById('note').textContent=`같은 장면을 고른 ${rr.length}명 중 ${mine.length}명이 한 모둠이에요.`},30)},emotion:renderEmotion,intensity:renderIntensity,body:renderBody,urge:renderUrge,reason:renderReason,meeting2:()=>{renderMeeting2();setTimeout(()=>{const d=debugData();d.meta={phase:'dialogue2',dialogue2Open:true,dialogue2Mode:'different'};d.groups={dialogue2:buildDialogue2Groups(d)};const g=myStoredGroup(d,'dialogue2'),mine=g?memberRows(d,g):[];document.getElementById('mode').textContent='서로 다른 장면을 섞은 모둠';document.getElementById('names').innerHTML=mine.map(r=>`<span class="name-chip ${r.id==='self'?'self':''}">${esc(r.nickname)}</span>`).join('');document.getElementById('note').textContent=`${mine.length}명이 한 모둠이에요.`},30)},life:renderLife,next:renderNextAction,summary:renderSummary,reflection:renderReflection,presenter:()=>renderPresenter(debugData()),presenter2:()=>{const d=debugData();d.meta.phase='deep';renderPresenterDeep(d)}};(f[debugMode]||renderIntro)();return}if(presenterMode){state.unsub=listen(`sessions/${state.sessionId}`,d=>renderPresenter(d||{participants:{},meta:{}}));return}await ensure();await routeParticipant()}
