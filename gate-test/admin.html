<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAMOUS PEOPLE · 진행자 테스트</title>
<style>
:root{--ink:#35556a;--bg:#e8edee;--card:#fffdf9;--line:#cad7da;--coral:#e48a79;--sage:#e8f0e2;--butter:#f7efcf}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Noto Sans KR',sans-serif;color:var(--ink)}main{max-width:1100px;margin:auto;padding:22px}.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;margin-bottom:14px}h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 12px;font-size:20px}p{color:#6b7d84;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c1d0d4;border-radius:13px;background:#fff;padding:11px 14px;font-weight:850;cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.coral{background:#fff0ec;border-color:#e7a393;color:#9a503f}.btn:disabled{opacity:.36;cursor:not-allowed}.code{font-size:38px;font-weight:950;letter-spacing:.12em;background:var(--butter);border-radius:14px;padding:8px 14px;display:inline-block}.url{font-size:13px;word-break:break-all;background:#f2f6f5;padding:10px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f7faf9;border:1px solid var(--line);border-radius:15px;padding:14px}.stat span{font-size:13px;color:#78888d}.stat b{font-size:27px;display:block;margin-top:3px}.phase{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--sage);font-weight:900}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.flow .btn{min-height:70px;text-align:left;line-height:1.3}.flow .btn small{display:block;font-weight:600;color:#74848a;margin-top:4px}.person{display:grid;grid-template-columns:1fr 130px 130px 130px;gap:8px;align-items:center;padding:9px 4px;border-top:1px solid #edf0ef}.person:first-child{border-top:0}.pill{display:inline-block;font-size:12px;padding:4px 7px;border-radius:999px;background:var(--sage)}.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px}.group{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fafcfb}.group b{display:block;margin-bottom:4px}.muted{color:#87969a}.msg{min-height:24px;color:#8b5b4b;font-weight:700}@media(max-width:760px){.stats,.flow,.groups{grid-template-columns:1fr 1fr}.person{grid-template-columns:1fr 1fr}.person span:nth-child(n+3){font-size:12px}}@media(max-width:480px){.stats,.flow,.groups{grid-template-columns:1fr}.row{display:grid}.btn{width:100%}}
</style></head><body><main>
<div class="card"><div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#b66d5d">PARTICIPANT-ADMIN TEST BRANCH</div><h1>FAMOUS PEOPLE · 진행자</h1><p>참가자는 기존에 만든 전체 활동 화면을 그대로 사용합니다. 대화 구간만 진행자가 열고 닫습니다.</p><div class="row"><button id="newBtn" class="btn primary">새 활동 만들기</button><button id="closeBtn" class="btn coral" disabled>활동 종료</button></div></div>
<div class="card" id="session" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><div>활동 코드</div><div class="code" id="code">------</div></div><div><div>현재 단계</div><div class="phase" id="phase">대기</div></div></div><p>참가자에게 아래 주소와 활동 코드를 알려주세요.</p><div class="url" id="url"></div><div class="row" style="margin-top:9px"><button class="btn" id="copyBtn">참가자 주소 복사</button><button class="btn" id="refreshBtn">지금 새로고침</button></div></div>
<div class="stats"><div class="stat"><span>입장 인원</span><b id="count">0</b></div><div class="stat"><span>장면 선택 완료</span><b id="focusCount">0</b></div><div class="stat"><span>깊이 보기 완료</span><b id="deepCount">0</b></div><div class="stat"><span>최종 문장</span><b id="finalCount">0</b></div></div>
<div class="card"><h2>진행 제어</h2><div class="flow"><button class="btn primary" id="d1">① 첫 번째 만남 시작<small>같은 장면끼리 모둠 생성 · 참가자 화면 잠금</small></button><button class="btn primary" id="deep">② 첫 만남 마치기 · 깊이 보기<small>잠금 해제 · 감정/강도/몸/행동/이유</small></button><button class="btn primary" id="d2">③ 두 번째 만남 시작<small>다른 장면을 섞어 모둠 생성 · 다시 잠금</small></button><button class="btn primary" id="life">④ 두 번째 만남 마치기<small>잠금 해제 · 역할 밖의 나로 이동</small></button></div><div id="msg" class="msg"></div></div>
<div class="card"><h2>현재 모둠</h2><div class="groups" id="groups"><span class="muted">아직 모둠이 없습니다.</span></div></div>
<div class="card"><h2>참가자 현황</h2><div id="people" class="muted">아직 참가자가 없습니다.</div></div>
</main><script>
const DB='https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app';let room='',timer=null,current=null;const $=s=>document.querySelector(s);
const PHASE={collecting:'개인 활동',dialogue1:'첫 번째 만남',deep:'내 마음 깊이 보기',dialogue2:'두 번째 만남',life:'역할 밖의 나'};
async function req(path,opt={}){const r=await fetch(DB+path+'.json',{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function code(){return String(Math.floor(100000+Math.random()*900000))}
async function create(){let c;for(let i=0;i<8;i++){c=code();if(!await req('/sessions/'+c+'/meta'))break}room=c;await req('/sessions/'+room+'/meta',{method:'PUT',body:JSON.stringify({createdAt:Date.now(),status:'open',phase:'collecting',dialogue1Open:false,dialogue2Open:false,branchTest:true})});$('#session').hidden=false;$('#code').textContent=room;$('#url').textContent=new URL('index.html?s='+room,location.href).href;$('#closeBtn').disabled=false;$('#msg').textContent='새 활동을 만들었습니다.';start()}
function participants(data){return Object.entries(data?.participants||{}).map(([id,p])=>({id,...p}))}
function splitSizes(n){if(n<=0)return[];const groups=Math.ceil(n/4),base=Math.floor(n/groups),extra=n%groups;return Array.from({length:groups},(_,i)=>base+(i<extra?1:0))}
function chunks(arr){const sizes=splitSizes(arr.length),out=[];let k=0;for(const n of sizes){out.push(arr.slice(k,k+n));k+=n}return out}
function buildD1(data){const ps=participants(data).filter(p=>p.focusScene),out={};let gi=1;const scenes=['scene01','scene02','scene03','scene04','scene05','scene06'];for(const s of scenes){for(const g of chunks(ps.filter(p=>p.focusScene===s))){out['g'+String(gi++).padStart(2,'0')]={sceneId:s,members:g.map(p=>p.id),createdAt:Date.now()}}}return out}
function buildD2(data){const ps=participants(data).filter(p=>p.focusScene&&p.deepDive?.reason).sort((a,b)=>a.id.localeCompare(b.id));const sizes=splitSizes(ps.length),b={};for(const p of ps)(b[p.focusScene]||(b[p.focusScene]=[])).push(p);const ordered=[];let more=true;while(more){more=false;const active=Object.values(b).filter(a=>a.length).sort((a,z)=>z.length-a.length);for(const a of active)if(a.length){ordered.push(a.shift());more=true}}const gs=sizes.map((cap,i)=>({id:'g'+String(i+1).padStart(2,'0'),cap,members:[],sceneIds:new Set()}));for(const p of ordered){let cand=gs.filter(g=>g.members.length<g.cap),t=cand.filter(g=>!g.sceneIds.has(p.focusScene)).sort((a,z)=>a.members.length-z.members.length)[0]||cand.sort((a,z)=>a.members.length-z.members.length)[0];if(t){t.members.push(p.id);t.sceneIds.add(p.focusScene)}}const out={};for(const g of gs)out[g.id]={mode:'mixedScenes',members:g.members,sceneIds:[...g.sceneIds],createdAt:Date.now()};return out}
async function patchMeta(obj){await req('/sessions/'+room+'/meta',{method:'PATCH',body:JSON.stringify(obj)});await load()}
async function startD1(){if(!current)return;const g=buildD1(current);if(!Object.keys(g).length){$('#msg').textContent='아직 장면을 선택한 참가자가 없습니다.';return}await req('/sessions/'+room+'/groups/dialogue1',{method:'PUT',body:JSON.stringify(g)});await patchMeta({phase:'dialogue1',dialogue1Open:true,dialogue1GeneratedAt:Date.now()});$('#msg').textContent='첫 번째 만남을 시작했습니다. 참가자 화면이 잠깁니다.'}
async function startDeep(){await patchMeta({phase:'deep',dialogue1Open:false});$('#msg').textContent='첫 번째 만남을 마쳤습니다. 참가자들이 깊이 보기로 이동합니다.'}
async function startD2(){if(!current)return;const g=buildD2(current);if(!Object.keys(g).length){$('#msg').textContent='아직 깊이 보기의 이유 선택까지 완료한 참가자가 없습니다.';return}await req('/sessions/'+room+'/groups/dialogue2',{method:'PUT',body:JSON.stringify(g)});await patchMeta({phase:'dialogue2',dialogue2Open:true,dialogue2Mode:'mixedScenes',dialogue2GeneratedAt:Date.now()});$('#msg').textContent='두 번째 만남을 시작했습니다. 참가자 화면이 다시 잠깁니다.'}
async function startLife(){await patchMeta({phase:'life',dialogue2Open:false});$('#msg').textContent='두 번째 만남을 마쳤습니다. 역할 밖의 나로 이동합니다.'}
function groupCards(data){const gs=data?.groups||{},ps=Object.fromEntries(participants(data).map(p=>[p.id,p]));const phase=data?.meta?.phase||'collecting',src=phase==='dialogue2'||phase==='life'?gs.dialogue2:gs.dialogue1;if(!src)return '<span class="muted">아직 모둠이 없습니다.</span>';return Object.entries(src).map(([id,g],i)=>`<div class="group"><b>모둠 ${i+1}</b>${(g.members||[]).map(pid=>ps[pid]?.nickname||'이름없음').join(' · ')||'없음'}</div>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){if(!room)return;try{const data=await req('/sessions/'+room);current=data||{};const ps=participants(data),ph=data?.meta?.phase||'collecting';$('#count').textContent=ps.length;$('#focusCount').textContent=ps.filter(p=>p.focusScene).length;$('#deepCount').textContent=ps.filter(p=>p.deepDive?.reason).length;$('#finalCount').textContent=ps.filter(p=>p.finalReflection?.text).length;$('#phase').textContent=PHASE[ph]||ph;$('#groups').innerHTML=groupCards(data);$('#people').innerHTML=ps.length?ps.map(p=>`<div class="person"><b>${esc(p.nickname||'이름없음')}</b><span>${p.focusScene?'<i class="pill">장면 선택</i>':'장면 진행 중'}</span><span>${p.deepDive?.reason?'<i class="pill">깊이 보기 완료</i>':'-'}</span><span>${p.finalReflection?.text?'<i class="pill">문장 공유</i>':'-'}</span></div>`).join(''):'<span class="muted">아직 참가자가 없습니다.</span>';$('#d1').disabled=ph!=='collecting';$('#deep').disabled=ph!=='dialogue1';$('#d2').disabled=ph!=='deep';$('#life').disabled=ph!=='dialogue2'}catch(e){$('#msg').textContent='확인 오류: '+e.message}}
function start(){clearInterval(timer);load();timer=setInterval(load,1200)}
async function closeRoom(){if(!room)return;await patchMeta({status:'closed'});$('#msg').textContent='활동을 종료했습니다.'}
$('#newBtn').onclick=create;$('#d1').onclick=startD1;$('#deep').onclick=startDeep;$('#d2').onclick=startD2;$('#life').onclick=startLife;$('#refreshBtn').onclick=load;$('#closeBtn').onclick=closeRoom;$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#url').textContent);$('#msg').textContent='참가자 주소를 복사했습니다.'};
</script></body></html>
