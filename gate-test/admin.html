<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAMOUS PEOPLE · 진행자 테스트</title>
<style>
:root{--ink:#35556a;--bg:#e8edee;--card:#fffdf9;--line:#cad7da;--coral:#e48a79;--sage:#e8f0e2;--butter:#f7efcf;--blue:#e6f5f7;--muted:#708187}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Noto Sans KR',sans-serif;color:var(--ink)}main{max-width:1180px;margin:auto;padding:22px}.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;margin-bottom:14px}h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 12px;font-size:20px}p{color:#6b7d84;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c1d0d4;border-radius:13px;background:#fff;padding:11px 14px;font-weight:850;cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.coral{background:#fff0ec;border-color:#e7a393;color:#9a503f}.btn.soft{background:var(--blue)}.btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.36;cursor:not-allowed}.code{font-size:38px;font-weight:950;letter-spacing:.12em;background:var(--butter);border-radius:14px;padding:8px 14px;display:inline-block}.url{font-size:13px;word-break:break-all;background:#f2f6f5;padding:10px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:#f7faf9;border:1px solid var(--line);border-radius:15px;padding:14px}.stat span{font-size:13px;color:#78888d}.stat b{font-size:27px;display:block;margin-top:3px}.phase{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--sage);font-weight:900}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.flow .btn{min-height:70px;text-align:left;line-height:1.3}.flow .btn small{display:block;font-weight:600;color:#74848a;margin-top:4px}.viewbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.viewbar strong{margin-right:4px}.view-help{font-size:12px;color:var(--muted);margin-left:auto}.overview-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.overview-head p{margin:4px 0 0;font-size:13px}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.group{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fafcfb;min-height:125px}.group:nth-child(4n+1){background:#fff8f5}.group:nth-child(4n+2){background:#fffaf0}.group:nth-child(4n+3){background:#f6fbf3}.group:nth-child(4n){background:#f4fafb}.group h3{font-size:16px;margin:0 0 5px}.rule{font-size:12px;color:var(--muted);font-weight:750;margin-bottom:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(53,85,106,.15);font-size:12px;font-weight:850}.scene-tag{display:inline-flex;min-width:24px;height:20px;align-items:center;justify-content:center;padding:0 5px;border-radius:999px;background:var(--blue);font-size:10px;font-weight:950}.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scene-card{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.scene-card h3{font-size:14px;margin:0 0 8px}.scene-card .count{font-size:25px;font-weight:950}.reflection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.reflection{min-height:105px;padding:13px;border-radius:15px;border:1px solid #dfddd5;background:#fffaf0}.reflection:nth-child(4n+1){background:#fde8e1}.reflection:nth-child(4n+2){background:#fff3cb}.reflection:nth-child(4n+3){background:#eef7e7}.reflection:nth-child(4n){background:#e6f5f7}.reflection .who{font-size:12px;font-weight:950;margin-bottom:6px}.reflection .txt{font-size:14px;line-height:1.45;font-weight:750}.split{display:grid;grid-template-columns:.75fr 1.25fr;gap:12px}.person-list{display:grid;gap:7px}.person{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 11px;border-radius:12px;border:1px solid #dfe4e1;background:#fff}.person b{font-size:13px}.pill{padding:4px 7px;border-radius:999px;background:var(--sage);font-size:11px;font-weight:900}.muted{color:#87969a}.msg{min-height:24px;color:#8b5b4b;font-weight:700}.empty{padding:26px;text-align:center;border:1px dashed #cbd6d3;border-radius:14px;color:#8a9895;background:#fafcfb}@media(max-width:900px){.groups,.scene-grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:10px}.groups,.scene-grid,.reflection-grid,.flow{grid-template-columns:1fr}.view-help{width:100%;margin-left:0}.stats{grid-template-columns:1fr 1fr}.row{display:grid}.btn{width:100%}}
</style>
</head>
<body><main>
<div class="card"><div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#b66d5d">PARTICIPANT-ADMIN TEST BRANCH</div><h1>FAMOUS PEOPLE · 진행자</h1><p>참가자는 기존 전체 활동 화면을 사용하고, 진행자는 만남 단계와 현황을 확인합니다.</p><div class="row"><button id="newBtn" class="btn primary">새 활동 만들기</button><button id="closeBtn" class="btn coral" disabled>활동 종료</button></div></div>
<div class="card" id="session" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><div>활동 코드</div><div class="code" id="code">------</div></div><div><div>현재 단계</div><div class="phase" id="phase">대기</div></div></div><p>참가자에게 아래 주소와 활동 코드를 알려주세요.</p><div class="url" id="url"></div><div class="row" style="margin-top:9px"><button class="btn" id="copyBtn">참가자 주소 복사</button><button class="btn" id="refreshBtn">지금 새로고침</button></div></div>
<div class="stats"><div class="stat"><span>입장 인원</span><b id="count">0</b></div><div class="stat"><span>장면 선택 완료</span><b id="focusCount">0</b></div><div class="stat"><span>깊이 보기 완료</span><b id="deepCount">0</b></div><div class="stat"><span>최종 한마디</span><b id="finalCount">0</b></div></div>
<div class="card"><h2>진행 제어</h2><div class="flow"><button class="btn primary" id="d1">① 첫 번째 만남 시작<small>같은 장면끼리 모둠 생성</small></button><button class="btn primary" id="deep">② 첫 만남 마치기 · 깊이 보기<small>감정·강도·몸·행동·이유</small></button><button class="btn primary" id="d2">③ 두 번째 만남 시작<small>다른 장면을 섞어 모둠 생성</small></button><button class="btn primary" id="life">④ 두 번째 만남 마치기<small>역할 밖의 나로 이동</small></button></div><div id="msg" class="msg"></div></div>
<div class="card"><div class="viewbar"><strong>현황 보기</strong><button class="btn soft active" data-view="current">현재 단계</button><button class="btn soft" data-view="first">1차 만남 모둠</button><button class="btn soft" data-view="second">2차 만남 모둠</button><button class="btn soft" data-view="final">최종 한마디</button><span class="view-help">수업 단계는 바뀌지 않고 진행자 화면만 전환됩니다.</span></div></div>
<div class="card" id="overview"><div class="empty">새 활동을 만들면 현황이 여기에 표시됩니다.</div></div>
</main>
<script>
const DB='https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app';
const SCENES=[
{id:'scene01',n:'01',title:'라디오에서 유명인이 된 순간'},
{id:'scene02',n:'02',title:'큰 행사를 취소하고 떠나기로 한 순간'},
{id:'scene03',n:'03',title:'떠난 곳에서 아는 사람과 다시 만난 순간'},
{id:'scene04',n:'04',title:'그날 밤, 과거가 떠오른 순간'},
{id:'scene05',n:'05',title:'기자가 비밀을 알려달라고 한 순간'},
{id:'scene06',n:'06',title:'40년 뒤, 다시 만나 삶을 돌아본 순간'}];
let room='',timer=null,current=null,viewMode='current';const $=s=>document.querySelector(s);
const PHASE={collecting:'개인 활동',dialogue1:'첫 번째 만남',deep:'내 마음 깊이 보기',dialogue2:'두 번째 만남',life:'역할 밖의 나'};
async function req(path,opt={}){const r=await fetch(DB+path+'.json',{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function code(){return String(Math.floor(100000+Math.random()*900000))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
function participants(data){return Object.entries(data?.participants||{}).map(([id,p])=>({id,...p}))}
function sceneInfo(id){return SCENES.find(s=>s.id===id)||{n:'--',title:'장면 미확인'}}
function splitSizes(n){if(n<=0)return[];const groups=Math.ceil(n/4),base=Math.floor(n/groups),extra=n%groups;return Array.from({length:groups},(_,i)=>base+(i<extra?1:0))}
function chunks(arr){const sizes=splitSizes(arr.length),out=[];let k=0;for(const n of sizes){out.push(arr.slice(k,k+n));k+=n}return out}
function buildD1(data){const ps=participants(data).filter(p=>p.focusScene),out={};let gi=1;for(const s of SCENES){for(const g of chunks(ps.filter(p=>p.focusScene===s.id))){out['g'+String(gi++).padStart(2,'0')]={sceneId:s.id,members:g.map(p=>p.id),createdAt:Date.now()}}}return out}
function buildD2(data){const ps=participants(data).filter(p=>p.focusScene&&p.deepDive?.reason).sort((a,b)=>a.id.localeCompare(b.id));const sizes=splitSizes(ps.length),b={};for(const p of ps)(b[p.focusScene]||(b[p.focusScene]=[])).push(p);const ordered=[];let more=true;while(more){more=false;const active=Object.values(b).filter(a=>a.length).sort((a,z)=>z.length-a.length);for(const a of active)if(a.length){ordered.push(a.shift());more=true}}const gs=sizes.map((cap,i)=>({id:'g'+String(i+1).padStart(2,'0'),cap,members:[],sceneIds:new Set()}));for(const p of ordered){let cand=gs.filter(g=>g.members.length<g.cap),t=cand.filter(g=>!g.sceneIds.has(p.focusScene)).sort((a,z)=>a.members.length-z.members.length)[0]||cand.sort((a,z)=>a.members.length-z.members.length)[0];if(t){t.members.push(p.id);t.sceneIds.add(p.focusScene)}}const out={};for(const g of gs)out[g.id]={mode:'mixedScenes',members:g.members,sceneIds:[...g.sceneIds],createdAt:Date.now()};return out}
async function create(){let c;for(let i=0;i<8;i++){c=code();if(!await req('/sessions/'+c+'/meta'))break}room=c;await req('/sessions/'+room+'/meta',{method:'PUT',body:JSON.stringify({createdAt:Date.now(),status:'open',phase:'collecting',dialogue1Open:false,dialogue2Open:false,branchTest:true})});$('#session').hidden=false;$('#code').textContent=room;$('#url').textContent=new URL('index.html?s='+room,location.href).href;$('#closeBtn').disabled=false;$('#msg').textContent='새 활동을 만들었습니다.';viewMode='current';setActiveView();start()}
async function patchMeta(obj){await req('/sessions/'+room+'/meta',{method:'PATCH',body:JSON.stringify(obj)});await load()}
async function startD1(){if(!current)return;const g=buildD1(current);if(!Object.keys(g).length){$('#msg').textContent='아직 장면을 선택한 참가자가 없습니다.';return}await req('/sessions/'+room+'/groups/dialogue1',{method:'PUT',body:JSON.stringify(g)});await patchMeta({phase:'dialogue1',dialogue1Open:true,dialogue1GeneratedAt:Date.now()});viewMode='first';setActiveView();renderOverview(current);$('#msg').textContent='첫 번째 만남을 시작했습니다.'}
async function startDeep(){await patchMeta({phase:'deep',dialogue1Open:false});viewMode='current';setActiveView();$('#msg').textContent='첫 번째 만남을 마쳤습니다.'}
async function startD2(){if(!current)return;const g=buildD2(current);if(!Object.keys(g).length){$('#msg').textContent='아직 깊이 보기까지 완료한 참가자가 없습니다.';return}await req('/sessions/'+room+'/groups/dialogue2',{method:'PUT',body:JSON.stringify(g)});await patchMeta({phase:'dialogue2',dialogue2Open:true,dialogue2Mode:'mixedScenes',dialogue2GeneratedAt:Date.now()});viewMode='second';setActiveView();renderOverview(current);$('#msg').textContent='두 번째 만남을 시작했습니다.'}
async function startLife(){await patchMeta({phase:'life',dialogue2Open:false});viewMode='final';setActiveView();$('#msg').textContent='두 번째 만남을 마쳤습니다. 최종 한마디를 기다립니다.'}
function groupMap(data,key){const ps=Object.fromEntries(participants(data).map(p=>[p.id,p]));return Object.entries(data?.groups?.[key]||{}).map(([id,g])=>({id,g,members:(g.members||[]).map(pid=>ps[pid]).filter(Boolean)}))}
function renderFirst(data){const gs=groupMap(data,'dialogue1');return `<div class="overview-head"><div><h2>1차 만남 현황</h2><p>같은 장면을 선택한 사람끼리 실제로 어떻게 묶였는지 확인합니다.</p></div><b>${gs.length}개 모둠</b></div>${gs.length?`<div class="groups">${gs.map((x,i)=>{const s=sceneInfo(x.g.sceneId);return `<div class="group"><h3>모둠 ${i+1} · ${x.members.length}명</h3><div class="rule">${s.n} ${esc(s.title)} · 같은 장면끼리</div><div class="chips">${x.members.map(p=>`<span class="chip">${esc(p.nickname||'이름없음')}</span>`).join('')}</div></div>`}).join('')}</div>`:'<div class="empty">아직 1차 만남 모둠이 만들어지지 않았습니다.</div>'}`}
function renderSecond(data){const gs=groupMap(data,'dialogue2');return `<div class="overview-head"><div><h2>2차 만남 현황</h2><p>서로 다른 장면의 사람을 어떻게 섞어 만났는지 확인합니다.</p></div><b>${gs.length}개 모둠</b></div>${gs.length?`<div class="groups">${gs.map((x,i)=>{const kinds=new Set(x.members.map(p=>p.focusScene).filter(Boolean)).size;return `<div class="group"><h3>모둠 ${i+1} · ${x.members.length}명</h3><div class="rule">서로 다른 장면 섞기 · ${kinds}개 장면</div><div class="chips">${x.members.map(p=>{const s=sceneInfo(p.focusScene);return `<span class="chip">${esc(p.nickname||'이름없음')}<span class="scene-tag">${s.n}</span></span>`}).join('')}</div></div>`}).join('')}</div>`:'<div class="empty">아직 2차 만남 모둠이 만들어지지 않았습니다.</div>'}`}
function renderFinal(data){const ps=participants(data),shared=ps.filter(p=>p.finalReflection?.text),waiting=ps.filter(p=>!p.finalReflection?.text);return `<div class="split"><div><div class="overview-head"><div><h2>최종 한마디 현황</h2><p>제출 여부를 확인합니다.</p></div></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span>제출</span><b>${shared.length}</b></div><div class="stat"><span>작성 중</span><b>${waiting.length}</b></div></div><div class="chips">${waiting.length?waiting.map(p=>`<span class="chip">${esc(p.nickname||'이름없음')}</span>`).join(''):'<span class="pill">모두 제출</span>'}</div></div><div><div class="overview-head"><div><h2>우리의 마지막 한 문장</h2><p>각자의 문장을 그대로 확인합니다.</p></div><b>${shared.length}개</b></div><div class="reflection-grid">${shared.length?shared.slice().reverse().map(p=>`<div class="reflection"><div class="who">${esc(p.nickname||'이름없음')}</div><div class="txt">${esc(p.finalReflection.text)}</div></div>`).join(''):'<div class="reflection"><div class="muted">아직 제출된 문장이 없습니다.</div></div>'}</div></div></div>`}
function renderCollecting(data){const ps=participants(data);return `<div class="overview-head"><div><h2>현재 단계 · 장면 선택</h2><p>어느 장면을 몇 명이 선택했는지 확인합니다.</p></div></div><div class="scene-grid">${SCENES.map(s=>{const xs=ps.filter(p=>p.focusScene===s.id);return `<div class="scene-card"><h3>${s.n} ${esc(s.title)}</h3><div class="count">${xs.length}명</div><div class="chips">${xs.map(p=>`<span class="chip">${esc(p.nickname||'이름없음')}</span>`).join('')||'<span class="muted">선택 없음</span>'}</div></div>`}).join('')}</div>`}
function renderDeep(data){const ps=participants(data);return `<div class="overview-head"><div><h2>현재 단계 · 깊이 보기</h2><p>두 번째 만남 준비 상태를 확인합니다.</p></div></div><div class="person-list">${ps.length?ps.map(p=>`<div class="person"><b>${esc(p.nickname||'이름없음')}</b><span class="${p.deepDive?.reason?'pill':'muted'}">${p.deepDive?.reason?'완료':'진행 중'}</span></div>`).join(''):'<div class="empty">참가자가 없습니다.</div>'}</div>`}
function renderCurrent(data){const ph=data?.meta?.phase||'collecting';if(ph==='dialogue1')return renderFirst(data);if(ph==='deep')return renderDeep(data);if(ph==='dialogue2')return renderSecond(data);if(ph==='life')return renderFinal(data);return renderCollecting(data)}
function renderOverview(data){if(!data){$('#overview').innerHTML='<div class="empty">활동을 시작하면 현황이 표시됩니다.</div>';return}$('#overview').innerHTML=viewMode==='first'?renderFirst(data):viewMode==='second'?renderSecond(data):viewMode==='final'?renderFinal(data):renderCurrent(data)}
function setActiveView(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===viewMode))}
async function load(){if(!room)return;try{const data=await req('/sessions/'+room);current=data||{};const ps=participants(data),ph=data?.meta?.phase||'collecting';$('#count').textContent=ps.length;$('#focusCount').textContent=ps.filter(p=>p.focusScene).length;$('#deepCount').textContent=ps.filter(p=>p.deepDive?.reason).length;$('#finalCount').textContent=ps.filter(p=>p.finalReflection?.text).length;$('#phase').textContent=PHASE[ph]||ph;$('#d1').disabled=ph!=='collecting';$('#deep').disabled=ph!=='dialogue1';$('#d2').disabled=ph!=='deep';$('#life').disabled=ph!=='dialogue2';renderOverview(data)}catch(e){$('#msg').textContent='확인 오류: '+e.message}}
function start(){clearInterval(timer);load();timer=setInterval(load,1200)}
async function closeRoom(){if(!room)return;await patchMeta({status:'closed'});$('#msg').textContent='활동을 종료했습니다.'}
$('#newBtn').onclick=create;$('#d1').onclick=startD1;$('#deep').onclick=startDeep;$('#d2').onclick=startD2;$('#life').onclick=startLife;$('#refreshBtn').onclick=load;$('#closeBtn').onclick=closeRoom;$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#url').textContent);$('#msg').textContent='참가자 주소를 복사했습니다.'};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewMode=b.dataset.view;setActiveView();renderOverview(current)});
</script></body></html>
