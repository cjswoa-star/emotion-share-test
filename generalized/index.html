<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만나고, 돌아보다</title>
<style>
:root{--bg:#f4f8fb;--paper:#fff;--ink:#10233f;--muted:#6f8091;--line:#dce5ed;--navy:#123453;--sky:#e9f4ff;--mint:#e4f5ee;--rose:#ffe3ea;--lav:#eee8ff;--yellow:#fff2c9;--shadow:0 14px 34px rgba(30,56,80,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eef7fb,#fbfaf7);color:var(--ink)}button,input,textarea,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:210px 1fr}.side{background:rgba(255,255,255,.94);border-right:1px solid var(--line);padding:24px 16px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:26px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#c9efdf,#e7f4ff);display:grid;place-items:center;font-size:24px}.brand b{display:block}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:#40546a;cursor:pointer}.nav button.active,.nav button:hover{background:#eaf4ff;color:#11365f;font-weight:700}.main{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{font-size:25px;margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:#173452;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.hero{max-width:980px;margin:58px auto}.hero h2{font-size:34px;margin:0 0 8px}.hero>p{color:var(--muted);margin:0 0 28px}.start{display:grid;grid-template-columns:1fr 1fr;gap:18px}.start-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);cursor:pointer}.start-card:hover{transform:translateY(-2px)}.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:23px;margin-bottom:18px}.start-card h3{margin:0 0 8px;font-size:21px}.start-card p{color:var(--muted);line-height:1.6;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{font-size:12px;padding:7px 10px;border-radius:999px;background:#f1f4f7;color:#526579}.editor{display:grid;grid-template-columns:280px minmax(430px,1fr) 320px;gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.ph{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:16px}.pb{padding:15px}.flow{display:grid;gap:8px}.flow-card{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid #e3eaf0;border-radius:12px;cursor:pointer;background:#fff}.flow-card.active{border-color:#6fb4f1;background:#f5fbff;box-shadow:inset 3px 0 0 #3b89d2}.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.flow-card b{display:block;font-size:14px}.flow-card small{display:block;font-size:11px;color:var(--muted)}.add{margin-top:11px;width:100%;border:1px dashed #b8c8d6;background:#f9fbfd;border-radius:11px;padding:11px;font-weight:800;color:#31506e;cursor:pointer}.field{margin-bottom:15px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d8e2ea;border-radius:10px;padding:10px 11px;color:#173452;background:#fff}.field textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 34px;gap:7px;margin-bottom:7px}.row input{border:1px solid #d8e2ea;border-radius:10px;padding:9px}.iconbtn{border:0;background:#f1f4f7;border-radius:9px;cursor:pointer}.subbtn{border:0;background:#eef5fb;color:#234b70;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer}.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.radio{border:1px solid #dce5ed;border-radius:10px;padding:9px;cursor:pointer;font-size:13px}.radio.on{border-color:#5ba4ea;background:#f3f9ff;color:#0e5594;font-weight:800}.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phonewrap{padding:16px;background:linear-gradient(180deg,#f6fbff,#fbfaf7)}.phone{width:280px;max-width:100%;margin:auto;border:7px solid #263746;border-radius:34px;background:#fff;min-height:520px;overflow:hidden;box-shadow:0 16px 30px rgba(25,48,68,.16)}.notch{height:17px;width:96px;background:#263746;margin:auto;border-radius:0 0 13px 13px}.screen{padding:22px 17px;min-height:490px;display:flex;flex-direction:column}.screen h4{text-align:center;font-size:20px;margin:8px 0 10px}.screen p{text-align:center;color:#687c90;font-size:13px;line-height:1.6}.preview-card{border:1px solid #e3e9ee;border-radius:13px;padding:13px;margin-top:12px}.preview-btn{margin-top:auto;border:0;border-radius:11px;background:var(--navy);color:#fff;padding:12px;font-weight:800}.mood{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:14px 0}.mood span{aspect-ratio:1;border-radius:5px}.mood span:nth-child(4n+1){background:#ffe1a2}.mood span:nth-child(4n+2){background:#ccefd9}.mood span:nth-child(4n+3){background:#deddff}.mood span:nth-child(4n){background:#f7cce2}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.choice{border:1px solid #dfe7ed;border-radius:11px;padding:10px;background:#fff8f4;font-size:12px;text-align:center}.modalbg{position:fixed;inset:0;background:rgba(16,35,63,.34);display:grid;place-items:center;padding:20px}.modal{width:min(680px,100%);background:#fff;border-radius:20px;padding:21px;box-shadow:0 30px 70px rgba(0,0,0,.18)}.blockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.block{border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer}.block b{display:block}.block small{color:var(--muted)}.danger{color:#a33}.titleinput{border:0;background:transparent;font-weight:900;font-size:22px;width:min(520px,58vw);color:var(--ink)}@media(max-width:1100px){.editor{grid-template-columns:260px 1fr}.editor>.panel:last-child{grid-column:1/-1}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:15px}.start,.editor{grid-template-columns:1fr}.blockgrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
'use strict';
const catalog={intro:{label:'안내 화면',sub:'활동 소개',color:'#dff2ff'},choice:{label:'상황 선택',sub:'선택지 고르기',color:'#fff0c9'},reflection:{label:'개인 응답',sub:'질문과 말문',color:'#e8efff'},meet:{label:'만남',sub:'모둠 대화',color:'#ffdce5'},mood:{label:'감정 다시 보기',sub:'무드미터',color:'#e6dcff'},connection:{label:'삶과 연결',sub:'경험 연결',color:'#dcf2e8'},share:{label:'전체 공유',sub:'응답 모아보기',color:'#dff7ef'},final:{label:'마지막 한마디',sub:'마무리 응답',color:'#dff1e5'}};
const uid=()=>Math.random().toString(36).slice(2,9);const clone=x=>JSON.parse(JSON.stringify(x));
const sample=()=>({title:'감정으로 만나고, 돌아보기',blocks:[{id:uid(),type:'intro',name:'안내 화면',title:'오늘은 여러 상황을 통해 내 마음을 들여다봅니다.',body:'정답은 없습니다. 느낀 점을 기록하고 친구의 이야기도 들어보세요.'},{id:uid(),type:'choice',name:'상황 선택',title:'어떤 상황이 가장 마음에 남나요?',options:['친구와 의견이 엇갈렸던 순간','발표를 앞둔 순간','새로운 친구를 만났던 순간','실수하고 다시 해보았던 순간']},{id:uid(),type:'reflection',name:'개인 응답',title:'그때 내 마음은 어땠나요?',questions:['어떤 감정을 느꼈나요?','감정의 강도는 어느 정도였나요?','그렇게 느낀 이유를 적어보세요.'],starters:['처음에는…','가장 크게 느껴진 감정은…','그 이유는…']},{id:uid(),type:'meet',name:'만남 1',title:'친구와 이야기 나누기',method:'same',groupSize:'auto',minutes:3,questions:['서로 어떤 감정을 느꼈는지 이야기해 보세요.','같은 상황을 다르게 느낀 점이 있었나요?'],starters:['나는 이 부분에서…','친구 이야기를 듣고…'],avoidRepeat:true},{id:uid(),type:'mood',name:'감정 다시 보기',title:'지금 이 경험을 떠올렸을 때 내 마음은 어디쯤인가요?',note:'무드미터에서 지금 마음과 가까운 위치를 골라보세요.'},{id:uid(),type:'meet',name:'만남 2',title:'다른 친구와 이야기 나누기',method:'different',groupSize:'4',minutes:4,questions:['이야기를 들으며 새롭게 보인 점은 무엇인가요?','서로 다른 마음이 생긴 이유는 무엇일까요?'],starters:['내 생각과 달랐던 점은…','새롭게 알게 된 것은…'],avoidRepeat:true},{id:uid(),type:'connection',name:'삶과 연결',title:'이 경험이 지금 내 생활과 어떻게 닿아 있나요?',questions:['비슷한 경험이 있었나요?','다음에 비슷한 일이 생기면 어떻게 해보고 싶나요?'],starters:['나도 예전에…','다음에는…']},{id:uid(),type:'final',name:'마지막 한마디',title:'오늘 활동을 한 문장으로 정리해 보세요.',starters:['오늘 나는…','친구 이야기를 들으며…','앞으로는…']}]});
let state={screen:'home',activity:sample(),selected:null,modal:false};state.selected=state.activity.blocks[0].id;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const current=()=>state.activity.blocks.find(b=>b.id===state.selected)||state.activity.blocks[0];
function sidebar(active){return `<aside class="side"><div class="brand"><div class="logo">🌿</div><div><b>만나고, 돌아보다</b><small>함께 만드는 수업 활동</small></div></div><div class="nav"><button class="${active==='home'?'active':''}" data-nav="home">⌂ 홈</button><button class="${active==='new'?'active':''}" data-nav="new">＋ 새로 만들기</button><button data-action="sample">▤ 예시 활동</button><button data-action="save">▣ 저장</button><button data-action="export">⇩ JSON 내보내기</button></div></aside>`}
function home(){return `<div class="shell">${sidebar('home')}<main class="main"><div class="top"><div><h1>활동 만들기</h1><div class="muted">질문, 만남, 감정 탐색을 원하는 순서로 구성합니다.</div></div></div><section class="hero"><h2>새로운 활동을 만들어보세요</h2><p>필요한 단계만 골라 순서를 정하고, 질문과 말문을 직접 바꿀 수 있습니다.</p><div class="start"><article class="start-card" data-start="blank"><div class="ico" style="background:#e8f4ff">✎</div><h3>처음부터 만들기</h3><p>빈 활동에서 시작해 필요한 단계를 직접 추가합니다.</p><div class="chips"><span class="chip">순서 자유</span><span class="chip">질문 수정</span><span class="chip">만남 위치 자유</span></div></article><article class="start-card" data-start="sample"><div class="ico" style="background:#e7f6ef">▤</div><h3>예시 활동에서 시작하기</h3><p>감정 탐색과 두 번의 만남이 들어간 기본 구조를 불러온 뒤 수정합니다.</p><div class="chips"><span class="chip">무드미터 포함</span><span class="chip">2회 만남</span><span class="chip">삶 연결</span></div></article></div></section></main></div>`}
function flowCard(b,i){const c=catalog[b.type];return `<div class="flow-card ${b.id===state.selected?'active':''}" data-select="${b.id}"><div class="num" style="background:${c.color}">${i+1}</div><div><b>${esc(b.name)}</b><small>${c.sub}</small></div><span>⋮⋮</span></div>`}
function listEditor(label,key,arr){return `<div class="field"><label>${label}</label>${(arr||[]).map((v,i)=>`<div class="row"><input data-list="${key}" data-index="${i}" value="${esc(v)}"><button class="iconbtn" data-remove="${key}" data-index="${i}">×</button></div>`).join('')}<button class="subbtn" data-add-list="${key}">＋ 추가</button></div>`}function starters(b){return listEditor('말문 도움','starters',b.starters||[])}
function settings(b){if(!b)return '<p>단계를 선택하세요.</p>';let out=`<div class="field"><label>단계 이름</label><input data-field="name" value="${esc(b.name)}"></div><div class="field"><label>학생에게 보일 제목</label><input data-field="title" value="${esc(b.title)}"></div>`;if(b.type==='intro')out+=`<div class="field"><label>안내 내용</label><textarea data-field="body">${esc(b.body||'')}</textarea></div>`;if(b.type==='choice')out+=listEditor('선택지','options',b.options);if(b.type==='reflection'||b.type==='connection')out+=listEditor('질문','questions',b.questions)+starters(b);if(b.type==='mood')out+=`<div class="field"><label>안내 문장</label><textarea data-field="note">${esc(b.note||'')}</textarea></div><p class="muted">무드미터 질문과 안내 문장은 자유롭게 수정할 수 있습니다.</p>`;if(b.type==='meet')out+=`<div class="field"><label>만남 방식</label><div class="radio-grid">${[['same','같은 선택끼리'],['different','다른 선택끼리'],['random','무작위'],['manual','진행자 직접 지정']].map(([v,t])=>`<div class="radio ${b.method===v?'on':''}" data-method="${v}">${t}</div>`).join('')}</div></div><div class="inline"><div class="field"><label>모둠 인원</label><select data-field="groupSize"><option value="auto" ${b.groupSize==='auto'?'selected':''}>자동</option><option value="2" ${b.groupSize==='2'?'selected':''}>2명</option><option value="3" ${b.groupSize==='3'?'selected':''}>3명</option><option value="4" ${b.groupSize==='4'?'selected':''}>4명</option></select></div><div class="field"><label>시간</label><select data-field="minutes">${[2,3,4,5,7,10].map(n=>`<option value="${n}" ${Number(b.minutes)===n?'selected':''}>${n}분</option>`).join('')}</select></div></div>${listEditor('만남 질문','questions',b.questions)}${starters(b)}`;if(b.type==='share')out+=`<div class="field"><label>공개 범위</label><select data-field="scope"><option>전체</option><option>모둠</option><option>진행자만</option></select></div>`;if(b.type==='final')out+=starters(b);out+=`<div style="border-top:1px solid var(--line);padding-top:13px"><button class="btn danger" data-action="delete">이 단계 삭제</button></div>`;return out}
function phone(b){if(!b)return '';let body='';if(b.type==='intro')body=`<p>${esc(b.body||'')}</p>`;if(b.type==='choice')body=`<div class="choices">${(b.options||[]).slice(0,4).map(x=>`<div class="choice">${esc(x)}</div>`).join('')}</div>`;if(b.type==='reflection'||b.type==='connection')body=`<div class="preview-card"><b>${esc((b.questions||[])[0]||'질문을 입력하세요.')}</b><div class="chips">${(b.starters||[]).slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><textarea style="width:100%;margin-top:10px;border:1px solid #dde5eb;border-radius:10px;min-height:80px"></textarea></div>`;if(b.type==='meet')body=`<p>${esc((b.questions||[])[0]||'친구와 이야기해 보세요.')}</p><div class="preview-card" style="text-align:center"><div style="font-size:42px">👥</div><b>${b.method==='same'?'같은 선택을 한 친구들과':b.method==='different'?'다른 선택을 한 친구들과':'새로운 친구들과'} 만나 이야기해요</b><div style="font-size:28px;font-weight:900;margin-top:14px">${String(b.minutes||3).padStart(2,'0')}:00</div></div>`;if(b.type==='mood')body=`<p>${esc(b.note||'')}</p><div class="mood">${'<span></span>'.repeat(16)}</div><p>불쾌함 ← 에너지 → 활기</p>`;if(b.type==='share')body=`<div class="preview-card"><b>친구들의 생각</b><p>응답이 이곳에 모여 보여집니다.</p></div>`;if(b.type==='final')body=`<p>오늘 활동을 돌아보며 한 문장으로 남겨보세요.</p><textarea style="width:100%;border:1px solid #dde5eb;border-radius:10px;min-height:115px"></textarea><div class="chips">${(b.starters||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`;return `<div class="phone"><div class="notch"></div><div class="screen"><h4>${esc(b.title||b.name)}</h4>${body}<button class="preview-btn">다음으로</button></div></div>`}
function editor(){const b=current();return `<div class="shell">${sidebar('new')}<main class="main"><div class="top"><div><button class="btn" data-nav="home">←</button> <input class="titleinput" id="activityTitle" value="${esc(state.activity.title)}"></div><div><button class="btn" data-action="save">저장하기</button> <button class="btn primary" data-action="run">활동 실행</button></div></div><div class="editor"><section class="panel"><div class="ph"><h3>1. 활동 단계</h3><span class="muted">${state.activity.blocks.length}개</span></div><div class="pb"><div class="flow">${state.activity.blocks.map(flowCard).join('')}</div><button class="add" data-action="add">＋ 단계 추가</button></div></section><section class="panel"><div class="ph"><h3>2. 단계 설정</h3><div><button class="btn" data-action="up">↑</button> <button class="btn" data-action="down">↓</button></div></div><div class="pb">${settings(b)}</div></section><section class="panel"><div class="ph"><h3>3. 학생 화면 미리보기</h3><span class="muted">모바일</span></div><div class="phonewrap">${phone(b)}</div></section></div>${state.modal?modal():''}</main></div>`}
function modal(){return `<div class="modalbg" data-action="close"><div class="modal" onclick="event.stopPropagation()"><h3>단계 추가</h3><p class="muted">필요한 블록을 선택하세요.</p><div class="blockgrid">${Object.entries(catalog).map(([k,c])=>`<div class="block" data-type="${k}" style="background:linear-gradient(180deg,#fff,${c.color}77)"><b>${c.label}</b><small>${c.sub}</small></div>`).join('')}</div><div style="text-align:right;margin-top:14px"><button class="btn" data-action="close">닫기</button></div></div></div>`}
function newBlock(type){const c=catalog[type],b={id:uid(),type,name:c.label,title:c.label};if(type==='intro')Object.assign(b,{title:'활동을 시작합니다.',body:'활동 안내를 입력하세요.'});if(type==='choice')Object.assign(b,{title:'어떤 것을 선택하겠나요?',options:['선택 1','선택 2','선택 3','선택 4']});if(type==='reflection')Object.assign(b,{title:'지금 떠오르는 생각을 적어보세요.',questions:['어떤 생각이나 감정이 들었나요?'],starters:['나는…','그때…']});if(type==='meet')Object.assign(b,{title:'친구와 이야기 나누기',method:'random',groupSize:'auto',minutes:3,questions:['서로의 생각을 이야기해 보세요.'],starters:['나는…','친구 이야기를 듣고…']});if(type==='mood')Object.assign(b,{title:'지금 내 마음은 어디쯤인가요?',note:'무드미터에서 현재 마음과 가까운 위치를 골라보세요.'});if(type==='connection')Object.assign(b,{title:'이 경험이 내 생활과 어떻게 이어지나요?',questions:['비슷한 경험이 있었나요?'],starters:['나도 예전에…','다음에는…']});if(type==='share')Object.assign(b,{title:'우리의 생각을 함께 봅니다.',scope:'전체'});if(type==='final')Object.assign(b,{title:'오늘 활동을 한 문장으로 정리해 보세요.',starters:['오늘 나는…','새롭게 알게 된 것은…']});return b}
function render(){document.getElementById('app').innerHTML=state.screen==='home'?home():editor();bind()}
function bind(){document.querySelectorAll('[data-nav="home"]').forEach(x=>x.onclick=()=>{state.screen='home';render()});document.querySelectorAll('[data-nav="new"]').forEach(x=>x.onclick=()=>{state.screen='editor';render()});document.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>{if(x.dataset.start==='blank')state.activity={title:'새 활동',blocks:[newBlock('intro')]};else state.activity=sample();state.selected=state.activity.blocks[0].id;state.screen='editor';render()});document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.select;render()});const t=document.getElementById('activityTitle');if(t)t.oninput=e=>state.activity.title=e.target.value;document.querySelectorAll('[data-field]').forEach(el=>el.onchange=e=>{const b=current();const k=el.dataset.field;b[k]=k==='minutes'?Number(el.value):el.value;render()});document.querySelectorAll('[data-field]').forEach(el=>{if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')el.oninput=e=>{current()[el.dataset.field]=el.value;const p=document.querySelector('.phonewrap');if(p)p.innerHTML=phone(current())}});document.querySelectorAll('[data-list]').forEach(el=>el.oninput=()=>{const b=current(),k=el.dataset.list,i=Number(el.dataset.index);b[k][i]=el.value;const p=document.querySelector('.phonewrap');if(p)p.innerHTML=phone(b)});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.remove,i=Number(el.dataset.index);b[k].splice(i,1);render()});document.querySelectorAll('[data-add-list]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.addList;b[k]=b[k]||[];b[k].push(k==='starters'?'말문을 입력하세요.':'질문을 입력하세요.');render()});document.querySelectorAll('[data-method]').forEach(el=>el.onclick=()=>{current().method=el.dataset.method;render()});document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{const b=newBlock(el.dataset.type),i=state.activity.blocks.findIndex(x=>x.id===state.selected);state.activity.blocks.splice(i+1,0,b);state.selected=b.id;state.modal=false;render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.action)})}
function act(a){const blocks=state.activity.blocks,i=blocks.findIndex(x=>x.id===state.selected);if(a==='add'){state.modal=true;render()}else if(a==='close'){state.modal=false;render()}else if(a==='delete'&&blocks.length>1){blocks.splice(i,1);state.selected=blocks[Math.max(0,i-1)].id;render()}else if(a==='up'&&i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];render()}else if(a==='down'&&i<blocks.length-1){[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];render()}else if(a==='sample'){state.activity=sample();state.selected=state.activity.blocks[0].id;state.screen='editor';render()}else if(a==='save'){localStorage.setItem('meet-reflect-v2',JSON.stringify(state.activity));alert('이 브라우저에 저장했습니다.')}else if(a==='export'){const blob=new Blob([JSON.stringify(state.activity,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='activity.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500)}else if(a==='run'){alert('편집기 1차 검증본입니다. 다음 단계에서 Firebase 세션과 학생 참여 화면을 연결합니다.')}}render();})();
</script>
</body></html>
