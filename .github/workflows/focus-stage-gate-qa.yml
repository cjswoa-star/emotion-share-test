name: Focus selection teacher gate live QA
on:
  push:
    paths:
      - '.github/workflows/focus-stage-gate-qa.yml'
      - 'qa/focus-stage-gate-e2e.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.1
      - run: node qa/focus-stage-gate-e2e.cjs
