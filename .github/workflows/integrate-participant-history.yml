name: Participant review setup
on:
  push:
    paths:
      - '.github/workflows/integrate-participant-history.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node qa/apply-review.cjs
      - name: Save participant history integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v10/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: link read-only participant review'
            git push
          fi
