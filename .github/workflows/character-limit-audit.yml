name: Audit participant character limits
on:
  push:
    paths:
      - '.github/workflows/character-limit-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit source limits
        run: node qa/audit-character-limits.cjs
      - name: Install browser
        run: npm install --no-save playwright@1.56.1
      - name: Enter maximum text in actual UI and verify Firebase persistence
        run: node qa/test-input-lengths-browser.cjs
