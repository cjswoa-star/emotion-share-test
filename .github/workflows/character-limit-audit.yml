name: Audit participant character limits
on:
  push:
    paths:
      - '.github/workflows/character-limit-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all input limits in production participant HTML
        run: node qa/audit-character-limits.cjs
