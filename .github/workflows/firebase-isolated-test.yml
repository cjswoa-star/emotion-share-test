name: Firebase isolated-browser live verification
on:
  push:
    paths:
      - '.github/workflows/firebase-isolated-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Verify live GitHub Pages and Firebase with isolated browsers
        run: node qa/firebase-isolated-test.cjs
