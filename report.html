<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FAMOUS PEOPLE SEL 활동 결과 PDF</title>
<style>
@page{size:A4 landscape;margin:13mm}
*{box-sizing:border-box}body{font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;margin:22px auto;max-width:1150px;color:#263e4a;line-height:1.55;font-size:13px}
h1{font-size:27px;margin:0 0 3px}h2{font-size:19px;margin:24px 0 8px;border-bottom:2px solid #537786;padding-bottom:5px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;margin:12px 0 20px;background:#e9f2f1;border-radius:12px}
button{background:#305b6c;color:white;padding:12px 19px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
.warn{color:#9d3737}.muted{color:#667881}.summary{padding:12px;background:#edf5f4;border-radius:9px;display:flex;gap:24px;flex-wrap:wrap;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.count,.group{padding:7px 10px;border-bottom:1px solid #d7e3e5}.count{display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th,td{border:1px solid #cad6d9;padding:7px;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}th{background:#e6eff0;text-align:left}th:nth-child(1){width:13%}th:nth-child(2){width:10%}th:nth-child(3){width:22%}th:nth-child(4){width:20%}
tr,.quote,.group{break-inside:avoid}.quote{border:1px solid #d7e3e5;border-radius:8px;margin:8px 0;padding:10px 13px}.quote p{white-space:pre-wrap;margin:4px 0}
footer{font-size:11px;color:#6b7e84;margin-top:20px}
@media print{body{margin:0;max-width:none;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar{display:none}h2{break-after:avoid}.grid{gap:0 14px}}
</style></head><body>
<div class="bar"><strong>FAMOUS PEOPLE SEL · 읽기 전용 결과 보고서</strong><button id="print" disabled>PDF로 저장 / 인쇄</button><span id="status">데이터를 확인 중입니다.</span></div>
<div id="report"><h1>활동 결과를 불러오는 중입니다.</h1></div>
<script>
(async function(){
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
 const code=(new URLSearchParams(location.search).get('s')||'').replace(/\D/g,'').slice(0,6);
 const status=document.getElementById('status'),button=document.getElementById('print'),target=document.getElementById('report');
 if(!/^\d{6}$/.test(code)){status.textContent='6자리 활동 코드가 필요합니다.';target.textContent='주소에 ?s=활동코드를 입력하세요.';return;}
 const url='https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app/sessions/'+code+'.json';
 let d;
 try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('서버 응답 '+r.status);d=await r.json();if(!d||!d.meta)throw new Error('활동 데이터가 없습니다.');}
 catch(e){status.textContent='불러오기 실패: '+e.message;target.innerHTML='<h1>활동 결과를 불러올 수 없습니다.</h1><p>기존 진행자 화면은 그대로 유지하세요. Firebase 접근 규칙 또는 활동 코드를 확인해야 합니다.</p>';return;}
 const people=Object.entries(d.participants||{}).map(([id,p])=>({id,...p})),names=['라디오에서 유명인이 된 순간','큰 행사를 취소하고 떠나기로 한 순간','떠난 곳에서 아는 사람과 다시 만난 순간','그날 밤, 과거가 떠오른 순간','기자가 비밀을 알려달라고 한 순간','떠나기 전날, 지인과 마지막으로 만난 순간','40년 뒤, 유명인의 삶을 돌아본 순간'];
 const scene=id=>{const m=/^scene0?([1-7])$/.exec(id||'');return m?m[1]+'. '+names[Number(m[1])-1]:'선택 없음';};
 const sectionGroups=key=>{const groups=Object.entries(d.groups?.[key]||{});return '<h2>'+(key==='dialogue1'?'1차':'2차')+' 만남 모둠</h2>'+(groups.length?groups.map(([id,g],i)=>'<div class="group"><b>모둠 '+(i+1)+'</b> · '+(g.members||[]).map(uid=>escape(d.participants?.[uid]?.nickname||uid)).join(' · ')+'</div>').join(''):'<p class="muted">저장된 모둠 없음</p>');};
 const row=p=>{const cols=[p.nickname||'마음친구',Object.keys(p.checkpoints||{}).filter(k=>p.checkpoints[k]).length+'/7',scene(p.focusScene),p.deepDive?.reason||'',p.finalReflection?.text||''];return '<tr>'+cols.map(s=>'<td>'+escape(s)+'</td>').join('')+'</tr>';};
 const reflection=people.filter(p=>p.finalReflection?.text).map(p=>'<div class="quote"><strong>'+escape(p.nickname||'마음친구')+'</strong><p>'+escape(p.finalReflection.text)+'</p></div>').join('');
 const stamp=new Date().toLocaleString('ko-KR');
 target.innerHTML='<h1>FAMOUS PEOPLE SEL · 활동 결과 보고서</h1><p class="muted">드라마로 읽는 나의 마음 · 활동 코드 '+escape(code)+' · 출력 기준 '+escape(stamp)+'</p>'+
 '<div class="summary"><span>전체 참가자 '+people.length+'명</span><span>장면 선택 '+people.filter(p=>p.focusScene).length+'명</span><span>깊이 보기 '+people.filter(p=>p.deepDive?.reason).length+'명</span><span>최종 한마디 '+people.filter(p=>p.finalReflection?.text).length+'명</span></div>'+
 '<h2>7개 장면 선택 현황</h2><div class="grid">'+names.map((n,i)=>'<div class="count"><span>'+(i+1)+'. '+escape(n)+'</span><b>'+people.filter(p=>p.focusScene==='scene'+String(i+1).padStart(2,'0')).length+'명</b></div>').join('')+'</div>'+
 sectionGroups('dialogue1')+sectionGroups('dialogue2')+
 '<h2>참가자별 활동 결과</h2><table><thead><tr><th>참가자</th><th>장면 완료</th><th>선택 장면</th><th>깊이 보기 이유</th><th>최종 한마디</th></tr></thead><tbody>'+people.map(row).join('')+'</tbody></table>'+
 '<h2>마지막 한마디 모음</h2>'+(reflection||'<p class="muted">등록된 최종 한마디 없음</p>')+
 '<footer>Firebase 활동 데이터를 읽기 전용으로 조회한 보고서입니다. 인쇄 또는 PDF 저장은 원본 데이터를 변경하지 않습니다. 참가자 개인정보가 포함될 수 있으므로 외부 공유에 주의하세요.</footer>';
 status.textContent='데이터 확인 완료 · 참가자 '+people.length+'명 · PDF 저장 가능';
 button.disabled=false;button.onclick=()=>window.print();
})();
</script></body></html>
