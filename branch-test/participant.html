<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAMOUS PEOPLE · 참가자 테스트</title><style>:root{--ink:#2b506a;--bg:#eef4f3;--paper:#fffdf9;--line:#d4dfdc;--coral:#ef8d79;--blue:#e6f5f7;--sage:#eef7e7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,'Noto Sans KR',sans-serif;color:var(--ink);padding:18px}.card{width:min(440px,100%);background:var(--paper);border:2px solid var(--ink);border-radius:24px;padding:24px;box-shadow:0 14px 34px rgba(43,80,106,.10)}.kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:#c46e5c}h1{font-size:29px;line-height:1.18;margin:8px 0 10px}p{color:#6c7b78;line-height:1.5}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}input{width:100%;height:56px;border:1.5px solid #bfd0d4;border-radius:14px;background:#fff;padding:0 14px;font-size:18px;font-weight:850}.code{text-align:center;font-size:25px;letter-spacing:.14em}.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}.msg{min-height:22px;margin-top:9px;font-size:13px;color:#b95e50;font-weight:800}.joined{display:none}.joined .badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--sage);color:#557345;font-size:12px;font-weight:900}.joined h2{font-size:26px;margin:14px 0 8px}.status{background:var(--blue);border:1px solid #c7dfe4;border-radius:16px;padding:14px;margin-top:16px}.status b{display:block;margin-bottom:4px}</style></head><body><div class="card"><div id="join"><div class="kicker">BRANCH TEST · 참가자</div><h1>활동 코드로 입장해 주세요.</h1><p>관리자 테스트 화면에서 만든 6자리 코드를 입력합니다.</p><div class="field"><label>활동 코드</label><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="000000"></div><div class="field"><label>별명</label><input id="nick" maxlength="12" placeholder="별명을 입력해 주세요"></div><button id="joinBtn" class="btn">입장하기</button><div id="msg" class="msg"></div></div><div id="joined" class="joined"><span class="badge">연결됨</span><h2><span id="who"></span>님, 입장했습니다.</h2><p>관리자 화면의 참가자 목록에 이 별명이 나타나면 실시간 연결 성공입니다.</p><div class="status"><b>활동 코드 <span id="showCode"></span></b><span id="sessionStatus">상태 확인 중…</span></div></div></div><script>const DB='https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app';const $=s=>document.querySelector(s);let code='',pid='';async function req(path,opt={}){const r=await fetch(DB+path+'.json',{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function participantId(){let id=localStorage.getItem('fp_branch_test_pid');if(!id){id='p_'+Math.random().toString(36).slice(2,10);localStorage.setItem('fp_branch_test_pid',id)}return id}async function join(){code=$('#code').value.replace(/\D/g,'').slice(0,6);const nickname=$('#nick').value.trim();if(code.length!==6)return msg('6자리 활동 코드를 입력해 주세요.');if(!nickname)return msg('별명을 입력해 주세요.');try{const meta=await req('/sessions/'+code+'/meta');if(!meta)return msg('존재하지 않는 활동 코드입니다.');if(meta.status==='closed')return msg('이미 종료된 활동입니다.');pid=participantId();await req('/sessions/'+code+'/participants/'+pid,{method:'PUT',body:JSON.stringify({nickname,state:'입장',joinedAt:Date.now(),branchTest:true})});$('#join').style.display='none';$('#joined').style.display='block';$('#who').textContent=nickname;$('#showCode').textContent=code;watch()}catch(e){msg('연결 오류: '+e.message)}}function msg(t){$('#msg').textContent=t}async function watch(){try{const meta=await req('/sessions/'+code+'/meta');$('#sessionStatus').textContent=meta?.status==='closed'?'관리자가 활동을 종료했습니다.':'관리자와 실시간 연결 중입니다.'}catch(e){$('#sessionStatus').textContent='상태 확인에 실패했습니다.'}setTimeout(watch,1500)}$('#code').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);$('#joinBtn').onclick=join;$('#nick').onkeydown=e=>{if(e.key==='Enter')join()}</script></body></html>
