<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAMOUS PEOPLE · 관리자 테스트</title><style>:root{--ink:#2b506a;--bg:#eef4f3;--card:#fffdf9;--line:#d5e0dd;--coral:#ef8d79;--sage:#eaf4e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Noto Sans KR',sans-serif;color:var(--ink)}main{max-width:900px;margin:auto;padding:24px}.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px;margin-bottom:14px}h1{margin:0 0 8px;font-size:28px}p{color:#687b78;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c7d5d2;border-radius:12px;background:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.danger{background:#fff2ed;color:#9c503f;border-color:#efb6a8}.code{font-size:34px;font-weight:950;letter-spacing:.12em;background:#fff3cb;border-radius:14px;padding:8px 14px;display:inline-block}.url{font-size:13px;word-break:break-all;background:#f5f8f7;padding:10px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7faf9;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:28px;display:block}.person{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid #edf0ee}.person:first-child{border-top:0}.pill{font-size:12px;background:var(--sage);padding:4px 8px;border-radius:999px}.muted{color:#889590}.ok{color:#557345;font-weight:800}@media(max-width:600px){.stats{grid-template-columns:1fr}.row{display:grid}.btn{width:100%}}</style></head><body><main><div class="card"><div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#c46e5c">BRANCH TEST · 관리자</div><h1>참가자·관리자 분리 연결 테스트</h1><p>이 페이지는 <b>participant-admin-test</b> 브랜치에서만 쓰는 실험용입니다. main은 건드리지 않습니다.</p><div class="row"><button id="newBtn" class="btn primary">새 테스트 활동 만들기</button><button id="closeBtn" class="btn danger" disabled>활동 종료</button></div></div><div id="session" class="card" hidden><div>활동 코드</div><div id="code" class="code">------</div><p>참가자는 아래 주소를 열고 코드를 입력합니다.</p><div id="url" class="url"></div><div class="row" style="margin-top:10px"><button id="copyBtn" class="btn">참가자 주소 복사</button><button id="refreshBtn" class="btn">지금 새로고침</button></div></div><div class="stats"><div class="stat"><span>입장 인원</span><b id="count">0</b></div><div class="stat"><span>상태</span><b id="status" style="font-size:20px">대기</b></div><div class="stat"><span>마지막 확인</span><b id="checked" style="font-size:17px">-</b></div></div><div class="card"><h2 style="margin-top:0">참가자</h2><div id="people" class="muted">아직 참가자가 없습니다.</div></div><p id="msg"></p></main><script>const DB='https://emotion-share-test-default-rtdb.asia-southeast1.firebasedatabase.app';let code='',timer=null;const $=s=>document.querySelector(s);function makeCode(){return String(Math.floor(100000+Math.random()*900000))}async function req(path,opt={}){const r=await fetch(DB+path+'.json',{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function create(){code=makeCode();await req('/sessions/'+code+'/meta',{method:'PUT',body:JSON.stringify({createdAt:Date.now(),status:'open',phase:'collecting',branchTest:true})});$('#session').hidden=false;$('#code').textContent=code;const base=location.href.split('/branch-test/')[0]+'/branch-test/participant.html';$('#url').textContent=base;$('#closeBtn').disabled=false;$('#msg').textContent='테스트 활동이 만들어졌습니다.';start()}async function load(){if(!code)return;try{const data=await req('/sessions/'+code);const ps=Object.values(data?.participants||{});$('#count').textContent=ps.length;$('#status').textContent=data?.meta?.status==='closed'?'종료':'진행 중';$('#checked').textContent=new Date().toLocaleTimeString();$('#people').innerHTML=ps.length?ps.map(p=>'<div class="person"><b>'+esc(p.nickname||'이름없음')+'</b><span class="pill">'+esc(p.state||'입장')+'</span></div>').join(''):'<span class="muted">아직 참가자가 없습니다.</span>'}catch(e){$('#msg').textContent='확인 오류: '+e.message}}function start(){clearInterval(timer);load();timer=setInterval(load,1500)}async function closeSession(){if(!code)return;await req('/sessions/'+code+'/meta/status',{method:'PUT',body:JSON.stringify('closed')});load()}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('#newBtn').onclick=create;$('#refreshBtn').onclick=load;$('#closeBtn').onclick=closeSession;$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#url').textContent);$('#msg').textContent='참가자 주소를 복사했습니다.'}</script></body></html>
